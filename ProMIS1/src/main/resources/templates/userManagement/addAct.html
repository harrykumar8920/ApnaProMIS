<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="layout/layout" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">


<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>Add Act</title>
</head>

<body>

	<div layout:fragment="content">

		<div class="row pt-2 pb-2">
			<!-- <div class="col-sm-9">
				<h5 class="page-title"></h5>
			</div> -->
			<div class="col-sm-3">
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a href="home">Home</a></li>
					<li class="breadcrumb-item active" aria-current="page">Add Act
					</li>
				</ol>
			</div>
		</div>

		<div class="row">
			<div class="col-lg-12">
				<div class="card">
					<div class="card-body">

						<form th:action="@{/updateAct}" method="post"
							class="needs-validation" th:object="${addAct}">
							<input type="hidden" th:field="*{isEditAct}">
							<div th:if="${message}"
								class="alert alert-success alert-dismissible" role="alert">
								<button type="button" class="close" data-dismiss="alert">&times;</button>
								<div class="alert-icon">
									<i class="fa fa-check"></i>
								</div>
								<div class="alert-message">
									<span th:text="${message}"></span>
								</div>
							</div>


							<div class="col-lg-12">
								<div class="card">
									<div class="card-body">
										<h4 class="form-header text-uppercase">
											<i class="fa fa-sitemap"></i> Add Act
										</h4>

										<input type="hidden" th:field="*{id}">

										<div class="form-group row">
											<label for="input-16" class="col-sm-2 col-form-label">Act
												<span class="text-danger">*</span>
											</label>
											<div class="col-sm-4">
												<input type="text" class="form-control" id="act"
													th:field="*{act}" name="act" placeholder="Enter Act"
													maxlength="40"> <span class="text-danger"
													th:if="${#fields.hasErrors('act')}" th:errors="*{act}"></span>
											</div>

											<label for="input-16" class="col-sm-2 col-form-label">
												Act Type <span class="text-danger">*</span>
											</label>
											<div class="col-sm-4">

												<select class="form-control" th:field="*{actType}"
													required="required">
													<option value="">choose</option>
													<option value="Other">Other</option>
													<option value="NCLT">NCLT</option>
												</select> <span class="text-danger"
													th:if="${#fields.hasErrors('actType')}"
													th:errors="*{actType}">Act Error</span>

											</div>
										</div>

										<div class="form-group row">
											<label for="input-16" class="col-sm-2 col-form-label">Description
												<!-- <span class="text-danger">*</span> -->
											</label>
											<div class="col-sm-4">
												<textarea class="form-control" id="act" name="the-textarea"
													th:field="*{description}" placeholder="Enter Description"
													rows="4" maxlength="250" autofocus></textarea>
												<div id="the-count">
													<span>Character Count-</span><span id="current"> 0</span> <span
														id="maximum">/ 250</span>
												</div>

											</div>
										</div>




										<div class="form-footer">



											<th:block th:if="${addAct.isEditAct == false}">
												<button type="submit" class="btn btn-success">
													<i class="fa fa-check-square-o"></i> Add
												</button>
											</th:block>

											<th:block th:if="${addAct.isEditAct == true}">
												<button type="submit" class="btn btn-success">
													<i class="fa fa-check-square-o"></i> Update
												</button>
											</th:block>


											<!-- <a href="backAct" class="btn btn-dark">RESET</a> -->
											<button type="reset" class="btn btn-danger">
												<i class="fa fa-times"></i> RESET
											</button>
										</div>


									</div>
								</div>
							</div>
						</form>



						<div class="form-group row">
							<table class="table table-respnsive table-bordered"
								id="AddActTable">
								<thead class="bg-info text-white">
									<tr>
										<th>S.No.</th>
										<th>Act</th>
										<th>Act Type</th>
										<th class="w-25">Description</th>
										<th>Action</th>

									</tr>
								</thead>
								<tbody>
									<tr th:each="p,stats: ${addActlist}">
										<td th:text="${stats.count}"></td>

										<!-- for finding data from different database table  -->
										<td th:text="${p.act}"></td>
										<td th:text="${p.actType}"></td>
										<td class="text-wrap" th:text="${p.description}"
											style="text-align: justify;"></td>



										<td><form action="editingAct">
												<button type="submit" th:name="editingAct"
													class="btn btn-info" th:value="${p.id}">Edit Act</button>
											</form> <!-- <button class="btn btn-info dropdown-toggle" type="button"
												data-toggle="dropdown">
												Action <span class="caret"></span>
											</button>
											<div class="dropdown-menu">

												<button type="submit" th:name="editingAct"
													th:value="${p.id}" class="dropdown-item">Edit Act</button>

												
											</div> --></td>
									</tr>
								</tbody>

							</table>
						</div>
					</div>
				</div>
			</div>
		</div>






		<script src="plugins/bootstrap-datatable/js/jquery.dataTables.min.js"></script>
		<script
			src="plugins/bootstrap-datatable/js/dataTables.bootstrap4.min.js"></script>

		<script type="text/javascript">
			$(document).ready(function() {
				var table = $('#AddActTable').DataTable({
					//			 	        lengthChange: false,
					buttons : [ 'copy', 'excel', 'pdf', 'print', 'colvis' ]
				});
			});

			function addNewAct() {
				//alert("inside method")
				$('#NewAct').attr('action', 'addNewAct');

				$('#NewAct').submit();
			}
		</script>
	</div>

</body>
</html>
