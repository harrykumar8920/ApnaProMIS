<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorator="layout/layout" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">


<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.3.2/jquery-confirm.min.css">
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.3.2/jquery-confirm.min.js"></script>
<title>ADD SANCTION ORDER DETAILS</title>
</head>

<body>

	<div layout:fragment="content">

		<div class="row pt-2 pb-2">
			<!-- <div class="col-sm-9">
				<h5 class="page-title"></h5>
			</div> -->
			<div class="col-sm-3">
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a href="puhStaffhome">Home</a></li>
					<li class="breadcrumb-item active" aria-current="page">ADD
						SANCTION ORDER DETAILS</li>
				</ol>
			</div>
		</div>

		<div th:if="${message}" class="alert alert-success alert-dismissible"
			role="alert">
			<button type="button" class="close" data-dismiss="alert">&times;</button>
			<div class="alert-icon">
				<i class="fa fa-check"></i>
			</div>
			<div class="alert-message">
				<span th:text="${message}"></span>
			</div>
		</div>


		<form th:action="@{/saveaddCase}" method="post"
			class="needs-validation" autocomplete="off"
			th:object="${addCase}" id="addCase"
			enctype="multipart/form-data">
			


			<div class="row">
				<div class="col-lg-12">
					<div class="card">
						<div class="card-body">




							
							<h4 class="form-header text-uppercase">
								<i class="fa fa-address-book-o"></i> Add
						SANCTION order  Details
							</h4>

							
						
						<input type="hidden" th:field="*{id}">
						<input type="hidden" th:field="*{proSanctionFileName}">
						
						





							
							
						
							<div class="form-group row" id="prosecutionSON">

								<label for="input-16" class="col-sm-2 col-form-label">
									Prosecution Sanction Order No <span class="text-danger">*
								</span>
								</label>
								<div class="col-sm-4">
									<input type="text" class="form-control"
										th:field="*{proSectionOrderNumber}"  > <span
										class="text-danger" th:errors="*{proSectionOrderNumber}"></span>
										
								</div>


							 <label for="input-16" class="col-sm-2 col-form-label">
									Prosecution Sanction Date <span class="text-danger">* </span>
								</label>
								<div class="col-sm-4">
									<input type="text" class="form-control" th:field="*{proSanctionDate}"
										id="proSanctionDate"> <span class="text-danger"
										th:errors="*{proSanctionDate}"></span>
								</div> 


							</div>

							<div class="form-group row" id="prosecutionSFile">
								<label for="input-16" class="col-sm-2 col-form-label">
									Prosecution Sanction Order File <span class="text-danger">
										* </span>
								</label>
								<div class="col-sm-2">
									<input type="file" class="form-control"
										th:field="*{prosectionSanctionOrderFile}"> 
										
										
										
										
										<span
										class="text-danger" th:errors="*{prosectionSanctionOrderFile}">
										
										</span>
								</div>
								<div class="col-sm-2">
								<label class=" col-form-label text-primary"> <a
										th:target="_blank"
										th:href="@{|/downloadFiles?fileName=*{proSanctionFileName}|}"><span
											th:text="*{proSanctionFileName}"></span>
											  <span th:if="*{proSanctionFileName}"><i
											class="fa fa-file-pdf-o" style="font-size: 24px; color: red"></i></span></a></label>
								
								
								</div>
								
								
								
								
								
								
								<label for="input-16" class="col-sm-2 col-form-label">
									File Number 
								</label>
								<div class="col-sm-4">
									<input type="text" class="form-control"
										th:field="*{fileNumber}" > <span
										class="text-danger" th:errors="*{fileNumber}"></span>
								</div>
								
								
								
							</div>
						
					

						<!-- 	<div class="form-group row" >

								<label for="input-16" class="col-sm-2 col-form-label">
									Investigation MCA Order No <span class="text-danger"></span>

								</label>
								<div class="col-sm-2">
									<input type="text" class="form-control"
										th:field="*{mcaorderno}" th:id="mcaorderno"> <span
										class="text-danger" th:errors="*{mcaorderno}"></span>
								</div>

								<label for="input-16" class="col-sm-2 col-form-label">
									Or <span class="text-danger"></span>
								</label> <label for="input-16" class="col-sm-2 col-form-label">
									Company Name <span class="text-danger"></span>

								</label>
								<div class="col-sm-2">
									<input type="text" class="form-control" th:field="*{compname}"
										th:id="compname"> <span class="text-danger"
										th:errors="*{compname}"></span>
								</div>

								<div class="col-sm-2">
									<input type="button" class="btn btn-info" value="Search"
										onclick="showDetails();">
								</div>

							</div> -->



							<div class="form-group row">


								<!-- <label for="input-16" class="col-sm-2 col-form-label">
									Case No<span class="text-danger">*</span>

								</label>
								<div class="col-sm-4">
									<input type="text" class="form-control" th:id="caseNo"
										th:field="*{caseId}"> <span class="text-danger"
										th:errors="*{caseId}"></span>
								</div> -->
								<label for="input-16" class="col-sm-2 col-form-label">
									Case Title /Company Name <span class="text-danger">*</span>

								</label>
								<div class="col-sm-4">
									<input type="text" class="form-control" th:id="caseTitle1"
										th:field="*{caseTitle}"> <span class="text-danger"
										th:errors="*{caseTitle}"></span>
								</div>
							</div>


							

							<div class="form-footer">
								<a class="btn btn-dark" href="puhStaffhome"> <i
									class="fa fa-check-square-o"></i> Back
								</a>
								<th:block th:unless="${addCase.id}">
								<!-- <button type="reset" class="btn btn-danger">
									<i class="fa fa-times"></i> Reset
								</button> -->
								<button type="reset" class="btn btn-danger"
									>
									<i class="fa fa-check-square-o"></i> Reset
								</button>
								
								
								
								</th:block>
								<th:block th:if="${addCase.id}">
								<button type="submit" class="btn btn-success"
									>
									<i class="fa fa-check-square-o"></i> Update
								</button></th:block>
								<th:block th:unless="${addCase.id}">
								<button type="submit" class="btn btn-success"
									>
									<i class="fa fa-check-square-o"></i> SAVE
								</button></th:block>

							</div>
						</div>
					</div>
				</div>

				

							
							</div>
							</form>
					
					

				
		

		<script src="plugins/bootstrap-datatable/js/jquery.d.min.js"></script>
		<script
			src="plugins/bootstrap-datatable/js/dataTables.bootstrap4.min.js"></script>
		<script src="plugins/bootstrap-datatable/js/jquery.dataTables.min.js"></script>
		<script
			src="plugins/bootstrap-datatable/js/dataTables.bootstrap4.min.js"></script>
		<script src="plugins/bootstrap-datatable/js/dataTables.buttons.min.js"></script>

		<script type="text/javascript" src="js/customValidation.js"></script>

<script type="text/javascript">

$('#proSanctionDate').datepicker({
	autoclose : true,
	todayHighlight : true,
	format : 'dd/mm/yyyy',
});



</script>


	
	</div>
</body>
</html>
