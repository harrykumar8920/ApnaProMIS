			<div class="col-sm-3">

					<li class="breadcrumb-item active" aria-current="page">All
						Pending Case Details</li>
				</ol>
			</div>
		</div>


		<div class="row">
			<div class="col-lg-12">
				<div class="card">
					<div class="card-body">
						<h4 class="form-header text-uppercase">
							<i></i>List of Court Cases

						</h4>


						<form th:action="@{/viewTaskdtl}" method="post"
							th:object="${assignedTaskPuh}" id="viewPendingTaskdtl1">
							<!-- <input type="hidden" th:field="*{user}"> <input
								type="hidden" th:field="*{createTask}"> <input
								type="hidden" th:field="*{proCourtCase}"> <input type="hidden"
								th:field="*{subtask}"> -->



							<div class="table-responsive">
								<table class="table table-bordered" id="assignedTable">
									<thead class="bg-info text-white">
										<tr>
											<th>S.No.</th>
											<th>Role of SFIO</th>
											<th>Court Case No</th>
											<th>Company Name</th>
											<th>Cause Title</th>


											<th>Prosecutor Name</th>
											<th>Task Name</th>

											<th>Action</th>


										</tr>
									</thead>
									<tbody>
										<tr th:each="p,stats: ${lstCourtCase}">
											<td th:text="${stats.count}"></td>
											<td th:text="${p.proCourtCase.sfioAs.SfioAs}"></td>
											<td th:text="${p.proCourtCase.courtCaseNo}"></td>
											<td th:text="${p.proCourtCase.invCaseDetail.caseTitle}"></td>
											<td th:text="${p.proCourtCase.causeTitle}"></td>
											<td th:text="${p.user.firstName}"></td>
											<td th:text="${p.createTask.task}"></td>

											<td><th:block th:if="${p.createTask.id==1}">
													<button type="submit" class="btn btn-success"
														th:name="viewTask" th:value="${p.id}">View</button>

												</th:block> <th:block th:unless="${p.createTask.id==1}">
													<button type="submit" class="btn btn-danger"
														disabled="disabled" th:name="initiateApprove"
														th:value="${p.id}">View</button>
												</th:block></td>
										</tr>


									</tbody>

								</table>
							</div>


						</form>




					</div>

				</div>
			</div>
		</div>
		<script src="plugins/bootstrap-datatable/js/jquery.dataTables.min.js"></script>

			src="plugins/bootstrap-datatable/js/dataTables.bootstrap4.min.js"></script>
