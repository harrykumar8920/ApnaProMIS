<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorator="layout/layout" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">


<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>Add New Respondent</title>
</head>

<body>

	<div layout:fragment="content"> 

		<div class="row pt-2 pb-2">
			<!-- <div class="col-sm-9">
				<h5 class="page-title"></h5>
			</div> -->
			<div class="col-sm-3">
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a href="">Home</a></li>
					<li class="breadcrumb-item active" aria-current="page">Add
						Act,Section Details</li>
				</ol>
			</div>
		</div>

		<div th:if="${message}" class="alert alert-success alert-dismissible"
			role="alert">
			<button type="button" class="close" data-dismiss="alert">&times;</button>
			<div class="alert-icon">
				<i class="fa fa-check"></i>
			</div>
			<div class="alert-message">
				<span th:text="${message}"></span>
			</div>
		</div>


		<form th:action="@{/ActSectionDetailsInfo}" method="post"
			class="needs-validation" autocomplete="off" th:object="${ActSecDetailsInfo}" id="ActSecDtl">

           <input type="hidden" th:field="*{procourtdtl}"> 
		   <input	type="hidden" th:field="*{id}" id="proActId">
            <input type ="hidden" th:id="courtId" name ="courtId">

			<div class="row">
				<div class="col-lg-12">
					<div class="card">
						<div class="card-body">
						
						
						
							<div class="form-group row">

								  <label
									class="col-sm-2 col-form-label"> Court Case No : </label>
								  <label class="col-sm-2 col-form-label text-primary"> 		
									<span th:text="${ActSecDetailsInfo.procourtdtl.courtCaseNo}"></span>
									</label>  
									 
									<label class="col-sm-2 col-form-label">Court :</label> 
									<label class="col-sm-2 col-form-label text-primary"> 
									<span th:text="${ActSecDetailsInfo.procourtdtl.courtType.courtName}"></span>
									</label> 
									
							</div>
							
							
							
							
							
							<h4 class="form-header text-uppercase">
								<i class="fa fa-address-book-o"></i> Add Act,Section Details
							</h4>
							<div class="form-group row">
							
							
							<label for="input-10" class="col-sm-2 col-form-label">Act
									<span class="text-danger">*</span>
								</label>
								<div class="col-sm-4">
									<select class="form-control" th:field="*{Act}"  th:id="actId">
										<option value="0">Choose Act</option>
										<option th:each="Act: ${actList}"
											th:value="${Act.id}" th:utext="${Act.act}"  />
									</select>	
									 <span class="text-danger" th:errors="*{act}"></span>
								</div> 	
							
							

								<label for="input-10" class="col-sm-2 col-form-label">Section
									<span class="text-danger">*</span>
								</label>
								<div class="col-sm-4">
									<select class="form-control" th:field="*{Section}" th:id = "secId" >
										<option value="0">Choose Section</option>
										<option th:each="Section: ${addSec}"
											th:value="${Section.id}" th:utext="${Section.Section}"  />
									</select>	
									 <span class="text-danger" th:errors="*{Section}"></span>
								</div> 	

									
							</div>
							<div class="form-group row">

								<label for="input-10" class="col-sm-2 col-form-label">Sub
									Section <span class="text-danger">*</span>
								</label>
								
								<div class="col-sm-4">
									<select class="form-control" th:field="*{SubSection}" th:id = "subsecId" >
										<option value="0">Choose Sub Section</option>
										<option th:each="SubSection: ${addSubSec}"
											th:value="${SubSection.id}" th:utext="${SubSection.SubSection}"  />	
									</select>
									
									 <span class="text-danger" th:errors="*{SubSection}"></span>
								</div> 											
								
								
								
								<label for="input-16" class="col-sm-2 col-form-label">Description
									 <span class="text-danger">*</span>
								</label>
								<div class="col-sm-4">
									<input type="text" class="form-control" id="Description" th:field="*{Description}"
									 name="Description" required="required" placeholder="Enter Description" maxlength="40" >
								</div>

							</div>
								<div class="form-footer">
								<button type="reset" class="btn btn-danger">
									<i class="fa fa-times"></i> Reset
								</button>
								<button type="submit" class="btn btn-success" id="update_btn">
									<i class="fa fa-check-square-o"></i> SAVE
								</button>
								<!-- <a class="btn btn-dark" href="AdditionalInfo"> <i
									class="fa fa-check-square-o"></i> Back
								</a> -->
								<button type="button" class="btn btn-dark" id="update_btn" th:onclick="'backPage(\'' + ${procourtdt} +'\');'">
							  		<i class="fa fa-check-square-o"></i> Back
							  </button> 
								
							</div>
						</div>
					</div>
				</div>
			</div>
		</form>
		
		<div class="row">
			<div class="col-lg-12">
				<div class="card">
					<div class="card-body">
						<h4 class="form-header text-uppercase">
							<i class="fa fa-user"></i> Status Details
						</h4>

						<div class="form-group row">
							<table class="table table-striped table-bordered" id="desigTable">
								<thead class="bg-info text-white">
									<tr>
															<th>S.No.</th>
															<th>Act</th>
															<th>Section</th>
															<th>SubSection</th>
															<th>Description</th>
															<!-- <th>Action</th> -->

														</tr>
								</thead>
								<tbody>
									<tr th:each="p,stats: ${actsecdtlsList1}">
															<td class="text-wrap" th:text="${stats.count}"></td> 
															<td class="text-wrap" th:text="${p.Act.act}"></td>
															<td class="text-wrap" th:text="${p.Section.Section}"></td>
															<td class="text-wrap" th:text="${p.SubSection.SubSection}"></td>
															<td class="text-wrap" th:text="${p.Description}"></td>
															
								</tbody>

							</table>
						</div>


					</div>

				</div>
			</div>
		</div>

			<script src="plugins/bootstrap-datatable/js/jquery.dataTables.min.js"></script>
		<script
			src="plugins/bootstrap-datatable/js/dataTables.bootstrap4.min.js"></script>
		<script type="text/javascript">
			$(document).ready(function() {
				var table = $('#userTable').DataTable({});
			});

			$('#uiDob').datepicker({
				autoclose : true,
				todayHighlight : true,
				format : 'dd/mm/yyyy',
			});

			$('#uiJoiningDate').datepicker({
				autoclose : true,
				todayHighlight : true,
				format : 'dd/mm/yyyy',
			});
			
			
			function backPage(courtID) {
				
    			$('#ActSecDtl').attr('action', 'AdditionalInfo');
    			$("#courtId").val(courtID)
    			$('#ActSecDtl').submit();
		}
			
			
			
			
			
			$('#actId')
			.on(
					'change',
					function() {
						var actId = $('#actId').val();
						$
								.ajax({
									//crossDomain: true,
									type : "GET",
									url : "showsSectionList?actId="
											+ actId,
									//contentType : "application/json; charset=utf-8",
									cache : false,
									timeout : 600000,
									success : function(data) {
										$('#secId').html('');
										var options = '';
										options += '<option value="0">Select</option>';
										for (var i = 0; i < data.length; i++) {
											options += '<option value="' + data[i].id + '">'
													+ data[i].section
													+ '</option>';
										}
										$('#secId').append(options);
									}

								});
					});	
			
			
			$('#secId')
			.on(
					'change',
					function() {
						var secId = $('#secId').val();
						//alert(stateid)
						$
								.ajax({
									//crossDomain: true,
									type : "GET",
									url : "showsSubSectionList?secId="
											+ secId,
									//contentType : "application/json; charset=utf-8",
									cache : false,
									timeout : 600000,
									success : function(data) {
										$('#subsecId').html('');
										var options = '';
										options += '<option value="0">Select</option>';
										for (var i = 0; i < data.length; i++) {
											options += '<option value="' + data[i].id + '">'
													+ data[i].subSection
													+ '</option>';
										}
										$('#subsecId').append(options);
									}

								});

					});

			
			
 $(document).ready(function() {
	 
	 var table = $('#desigTable').DataTable( {
//	        lengthChange: false,
	        buttons: [ 'copy', 'excel', 'pdf', 'print', 'colvis' ]
	      } );
	 
	 
				if($('#proActId').val()==' '){
				if($('#actId').val()!=0){
				var actId = $('#actId').val();
                   // alert(actId);
                    debugger
				var token = $("input[name=_csrf]").val();
				var header = 'X-CSRF-TOKEN';
						$(document).ajaxSend(
								function(e, xhr, options) {
									xhr.setRequestHeader(
											header, token);
								}),
						$
								.ajax({
									crossDomain : true,
									type : "GET",
									url : "showsSectionList?actId="
											+ actId,
									contentType : "application/json; charset=utf-8",
									/* data:{caseId:caseId
									}, */
									cache : false,
									
									timeout : 600000,
									success : function(data) {
										//alert(data);
										var html = '';
										var len = data.length;
										$("#secId").empty();
										$("#secId")
												.append(

												"<option value='0'>Select</option>");
										for (var i = 0; i < len; i++) {
											var id = data[i]['id'];
											var name = data[i]['section'];

											//alert(id +" "+ name);
											
											$("#secId")
													.append(

															"<option value='"+id+"'>"
																	+ name
																	+ "</option>");

										}
									},
									error : function(xhr,
											status, error) {
										alert('error in getting Section');
									}
								});

			}
				}
			
})
		</script>

		<script type="text/javascript" src="js/customValidation.js"></script>




	</div>

</body>
</html>
