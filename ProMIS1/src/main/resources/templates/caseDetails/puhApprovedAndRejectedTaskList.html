<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="layout/layout" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">


<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<link
	href="plugins/bootstrap-datatable/css/dataTables.bootstrap4.min.css"
	rel="stylesheet" type="text/css">
<link href="plugins/bootstrap-datatable/css/buttons.bootstrap4.min.css"
	rel="stylesheet" type="text/css">
<title>Cases listed for Hearing next 7 days</title>

</head>

<body>

	<div layout:fragment="content">

		<div class="row pt-2 pb-2">
			<!-- <div class="col-sm-9">
				<h5 class="page-title"></h5>
			</div> -->
			<div class="col-sm-3">
				<ol class="breadcrumb">
					
				
					<li class="breadcrumb-item"><a href="puhHome">Home</a></li>
					
					
						
						
						
						
					


					<li class="breadcrumb-item active" aria-current="page">Tasks in progress</li>
				</ol>
			</div>
		</div>


		<div class="row">
			<div class="col-lg-12">
				<div class="card">
					<div class="card-body">
						<h4 class="form-header text-uppercase">
							<i class="fa fa-address-book-o"></i> Tasks in progress

						</h4>


						<div class="table-responsive">
												<table class="table table-bordered" id="assignedTable">
													<thead class="bg-info text-white">
														<tr>
															<th>S.No.</th>
															<th>Task Name</th>

															<th>Company Name</th>
															<th>Case No.</th>
															<th>Cause Title</th>
															
															<th>Priority</th>


															<th>Assign to
															</th>


															<th>PROSECUTION <br>SANCTION ORDER FILE
															</th>

															<th>Action</th>



														</tr>
													</thead>
													<tbody>
														<tr th:each="p,stats: ${listAssinedTask}">
															<td th:text="${currentRow+stats.count-1}"></td>
															<td th:text="${p.createTask.task}"></td>
															<td th:text="${p.proCourtCaseDetails.addCase.caseTitle}"
																style="white-space: normal; word-wrap: break-word;"></td>
																
																<td th:text="${p.proCourtCaseDetails.courtCaseNo}"
																															style="white-space: normal; word-wrap: break-word;"></td>

															<td>
																<form th:action="@{/puhApproval}" method="post"
																	th:object="${assignTaskIDNew}">
																		<button type="submit" th:name="assignTaskIDNew"														
																			th:value="${p.proCourtCaseDetails.id}" class="text-wrap"  th:text="${p.proCourtCaseDetails.causeTitle}"
																			style="border:none; background:none; padding:0; margin:0; box-shadow:none; cursor:pointer; color: blue"
																			>														
																		</button>
																</form>
																	<td>




															

																	<th:block th:if="${p.proCourtCaseDetails.caseStatusCheck == 1}">
																		<button type="submit" th:name="assignTaskIDNew"
																			class="bg-success p-2 rounded-pill text-white"
																			th:value="${p.proCourtCaseDetails.id}">

																			Routine
																		</button>

																	</th:block>

																	<th:block th:if="${p.proCourtCaseDetails.caseStatusCheck == 2}">
																		<button type="submit" th:name="assignTaskIDNew"
																			class="bg-warning p-2 rounded-pill text-white"
																			th:value="${p.proCourtCaseDetails.id}">

																			Advance stage of trial
																		</button>

																	</th:block>

																	<th:block th:if="${p.proCourtCaseDetails.caseStatusCheck == 3}">
																		<button type="submit" th:name="assignTaskIDNew"
																			class="bg-danger p-2 rounded-pill text-white"
																			th:value="${p.proCourtCaseDetails.id}">

																			High Priority
																		</button>

																	</th:block>






																

															</td>


															<!--<td
																	th:text="${#dates.format(p.proCourtCaseDetails.addCase.proSanctionDate, 'dd/MM/yyyy')}">
																</td>-->
															<td> <span
																	th:text="${p.user.salutation + ' ' + p.user.firstName + ' '  + (p.user.middleName ?: '') + ' '  + p.user.lastName}"></span>
															</td>





															<td><label class=" col-form-label text-primary">
																	<a th:target="_blank"
																		th:href="@{|/downloadFiles?fileName=${p.proCourtCaseDetails.addCase.proSanctionFileName}|}">

																		<span>View</span> <span
																			th:unless="${p.proCourtCaseDetails.addCase.proSanctionFileName==null}"><i
																				class="fa fa-file-pdf-o"
																				style="font-size: 24px; color: red"></i></span>
																	</a>
																</label></td>


															<td>
																<form th:action="@{/puhApproval}" method="post"
																	th:object="${assignedTaskPuh}" id="viewPendingTaskdtl1">
																	<th:block th:if="${p.createTask.id==2}">
																		<button type="submit" th:name="assignTaskID1"
																			class="btn btn-success" th:value="${p.id}">Additional
																			Details</button>
																	</th:block>


																	<th:block th:if="${p.createTask.id==11}">
																		<button type="submit" th:name="assignTaskID1"
																			class="btn btn-success" th:value="${p.id}"> ribunal Petition
																			Details</button>
																	</th:block>


																</form>

															</td>

														</tr>


													</tbody>

												</table>
											</div>




					</div>

				</div>
			</div>
		</div>
		<script src="plugins/bootstrap-datatable/js/jquery.dataTables.min.js"></script>
		<script
			src="plugins/bootstrap-datatable/js/dataTables.bootstrap4.min.js"></script>
		<script type="text/javascript">
			$(document).ready(function() {

				var table = $('#assignedTable').DataTable({
					//		 	        lengthChange: false,
					buttons : [ 'copy', 'excel', 'pdf', 'print', 'colvis' ]
				});
			});
		</script>

	</div>

</body>
</html>
