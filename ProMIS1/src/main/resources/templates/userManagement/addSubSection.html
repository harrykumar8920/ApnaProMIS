<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="layout/layout" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">


<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>Add Sub Section</title>
</head>

<body>

	<div layout:fragment="content">

		<div class="row pt-2 pb-2">
			<!-- <div class="col-sm-9">
				<h5 class="page-title"></h5>
			</div> -->
			<div class="col-sm-3">
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a href="home">Home</a></li>
					<li class="breadcrumb-item active" aria-current="page">Add Sub
						Section</li>
				</ol>
			</div>
		</div>


		<form th:action="@{/editSubSec}" method="post"
			class="needs-validation" th:id = "NewSubSec" th:object="${addSubSec}">


			<div th:if="${message}" class="alert alert-success alert-dismissible"
				role="alert">
				<button type="button" class="close" data-dismiss="alert">&times;</button>
				<div class="alert-icon">
					<i class="fa fa-check"></i>
				</div>
				<div class="alert-message">
					<span th:text="${message}"></span>
				</div>
			</div>


			

			<!-- Saurabh Changes Start -->


			<div class="row">
				<div class="col-lg-12">
					<div class="card">
						<div class="card-body">
							<h4 class="form-header text-uppercase">
								<i class="fa fa-address-book-o"></i>
								<h4>Add Sub Sections</h4>


								<button type="button" th:onclick="addNewSubSec();" 
									class="btn btn-success">Add New</button>
							</h4>



							<div class="form-group row">
								<table class="table table-resppnsive table-bordered" id="AddSubSecTable">
									<thead class="bg-info text-white">
										<tr>
											<th class="w-15">S.No.</th>
											<th class="w-15">Act</th>
											<th class="w-15"> Sections</th>
											<th class="w-15">Sub Sections</th>
											<th class="w-15">Description</th>
											<th class="w-15">Action</th>

										</tr>
									</thead>
									<tbody>
										<tr th:each="p,stats: ${addsubsec1}">
											<td th:text="${stats.count}"></td>

											<!-- for finding data from different database table  -->
											<td th:text="${p.Section.act.act}"></td>
											<td th:text="${p.Section.Section}"></td>
											<td th:text="${p.SubSection}"></td>
											<td style="text-align: justify;" class="text-wrap" th:text="${p.description}"></td>
											<td>
												

													<button class="btn btn-info dropdown-toggle" type="button"
														data-toggle="dropdown">
														Action <span class="caret"></span>
													</button>

													<div class="dropdown-menu">

														<!-- <button type="submit" th:name="caseDetails" th:id="caseId"
																th:value="${detail.id}" class="dropdown-item" >View case Details</button>
		 -->

														<button type="submit" th:name="editingSubSec"
															th:value="${p.id}" class="dropdown-item">Edit
															Sub Sec</button>

													 	<!-- <button type="submit" class="dropdown-item">DeActive
															Act Sec</button>  -->
														
															 <th:block th:if="${p.isActive==1}">
													        <button class="text-wrap dropdown-item" type="submit"   th:name="Deactivate" 
													        th:value="${p.id}" >Deactivate</button>
													       </th:block>
													       <th:block th:if="${p.isActive==0}">
													        <button class="text-wrap dropdown-item" type="submit"   th:name="activate" 
													        th:value="${p.id}" >Activate</button>
													       </th:block>
															
													</div>
											</td>

											<!-- 	<td	><button type="submit" th:name=""
											th:value="${}" class="btn btn-info">hello</button></td>-->

											<!-- Q ->	how create JavaScript Validation?	 -->

										</tr>
									</tbody>

								</table>
							</div>
						</div>
					</div>
				</div>
			</div>






			<script src="plugins/bootstrap-datatable/js/jquery.dataTables.min.js"></script>
			<script
				src="plugins/bootstrap-datatable/js/dataTables.bootstrap4.min.js"></script>
			<!-- <script type="text/javascript">
		$(document).ready(function(){
			
			 var table = $('#desigTable').DataTable( {
//		 	        lengthChange: false,
			        buttons: [ 'copy', 'excel', 'pdf', 'print', 'colvis' ]
			      } );
		});
		
		</script>	 -->

			<script type="text/javascript">
			$(document).ready(function(){
				 var table = $('#AddSubSecTable').DataTable( {
//			 	        lengthChange: false,
				        buttons: [ 'copy', 'excel', 'pdf', 'print', 'colvis' ]
				      } );
			});
			
		 	function addNewSubSec() {
		 		//alert("inside method")
				$('#NewSubSec').attr('action', 'addNewSubSec');
	  			
	  			$('#NewSubSec').submit();
			} 
		</script>
	</div>

</body>
</html>
