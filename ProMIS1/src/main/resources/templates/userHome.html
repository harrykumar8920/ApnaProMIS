<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
layout:decorator="layout/layout" xmlns:th="http://www.thymeleaf.org"
 xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>Home Page</title>
</head>

<body>

	<div layout:fragment="content" sec:authorize="hasRole('ROLE_OFFICER')">

	<div class="row mt-3">
       
       <div class="col-12 col-lg-6 col-xl-4">
         <div class="card gradient-info">
           <div class="card-body">
              <h5 class="text-white mb-0" ><span th:text="${totleAplicant}"></span><span class="float-right"><i class="zmdi zmdi-layers"></i></span></h5>
                <div class="progress my-3" style="height:3px;">
                   <div class="progress-bar" style="width:55%"></div>
                </div>
              <p class="mb-0 text-white small-font">Total Person<span class="float-right"><a href="getApplicant2" class="text-white">More Info</a> <i class="zmdi zmdi-long-arrow-right"></i></span></p>
            </div>
         </div> 
       </div>
       
      
       <div class="col-12 col-lg-6 col-xl-4">
         <div class="card gradient-orange">
           <div class="card-body">
              <h5 class="text-white mb-0" ><span th:text="${ApprovedpersonList}"></span><span class="float-right"><i class="zmdi zmdi-layers"></i></span></h5>
                <div class="progress my-3" style="height:3px;">
                   <div class="progress-bar" style="width:55%"></div>
                </div>
              <p class="mb-0 text-white small-font">Approved Person<span class="float-right"><a href="getApplicant2" class="text-white">More Info</a> <i class="zmdi zmdi-long-arrow-right"></i></span></p>
            </div>
         </div> 
       </div>
       
      
      
     </div>



	</div>

</body>
</html>
