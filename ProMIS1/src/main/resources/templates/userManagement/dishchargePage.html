<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="layout/layout" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">


<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>Add Discharge</title>
</head>

<body>

	<div layout:fragment="content">
		<div class="row pt-2 pb-2">

			<div class="col-sm-3">
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a href="home">Home</a></li>
					<li class="breadcrumb-item active" aria-current="page">Add
						Discharge</li>
				</ol>
			</div>
		</div>


		<form th:action="@{/addDischarge}" method="post"
			class="needs-validation" th:object="${disob}">



			<div th:if="${message}" class="alert alert-success alert-dismissible"
				role="alert">
				<button type="button" class="close" data-dismiss="alert">&times;</button>
				<div class="alert-icon">
					<i class="fa fa-check"></i>
				</div>
				<div class="alert-message">
					<span th:text="${message}"></span>
				</div>
			</div>

			<div class="row">
				<div class="col-lg-12">
					<div class="card">
						<div class="card-body">
							<h4 class="form-header text-uppercase">
								<i class="fa fa-sitemap"></i> Add Discharge
							</h4>

							<div class="form-group row">

								<label for="input-10" class="col-sm-2 col-form-label">
									Discharge<span class="text-danger">*</span>
								</label>
								<div class="col-sm-4">
									<input class="form-control" type="text"
											th:field="*{dischargeName}"
											placeholder="Enter the Discharge" maxlength="50" /> <span
											class="text-danger" th:errors="*{dischargeName}"></span>
								
								</div>


							</div>



							<div class="form-group row">


								<div class="col-sm-4">
									<button type="submit" class="btn btn-success">
										<i class="fa fa-check-square-o"></i> save
									</button>

									<button type="reset" class="btn btn-danger">
										<i class="fa fa-times"></i> Reset
									</button>
								</div>


							</div>



						</div>


					</div>
				</div>
			</div>

		</form>
		<div class="row">
			<div class="col-lg-12">
				<div class="card">
					<div class="card-header ">
						<i class="fa fa-table"></i> Discharge List Detail
					</div>
					<div class="card-body">
						<div class="table-responsive">
							<table id="caseTable" class="table table-bordered">

								<thead class="bg-info">
									<tr>
										<th>S.No.</th>
										<th>Discharge</th>


									</tr>
								</thead>
								<tbody>
									<tr th:each="p,stats: ${listdischarge}">
										<td th:text="${stats.count}"></td>
										<td th:text="${p.dischargeName}"></td>

									</tr>
								</tbody>

							</table>
						</div>


					</div>

				</div>
			</div>
		</div>


		<script src="plugins/bootstrap-datatable/js/jquery.d.min.js"></script>
		<script
			src="plugins/bootstrap-datatable/js/dataTables.bootstrap4.min.js"></script>
		<script src="plugins/bootstrap-datatable/js/jquery.d.min.js"></script>
		<script
			src="plugins/bootstrap-datatable/js/dataTables.bootstrap4.min.js"></script>
		<script src="plugins/bootstrap-datatable/js/jquery.dataTables.min.js"></script>
		<script
			src="plugins/bootstrap-datatable/js/dataTables.bootstrap4.min.js"></script>
		<script src="plugins/bootstrap-datatable/js/dataTables.buttons.min.js"></script>

		<script type="text/javascript">
			$(document).ready(function() {

				var table = $('#caseTable').DataTable({
					//		 	        lengthChange: false,
					buttons : [ 'copy', 'excel', 'pdf', 'print', 'colvis' ]
				});
			});
		</script>

	</div>
</body>
</html>
