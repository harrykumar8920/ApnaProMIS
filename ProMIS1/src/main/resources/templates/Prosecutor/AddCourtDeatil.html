		<script type="text/javascript">
			$(document).ready(function () {
				var selectedType = $('#stateid').val();

				$('#typeOfCaseType').val(selectedType);
				$('#typeOfCaseType').prop('disabled', true);
				$("#typeOfCaseType").change(function () {
					var selectedText = $(this).find("option:selected").text();
					var courtType = $(this).val();

					$.ajax({
						type: "GET",
						url: "getTypeOfCase?courtType=" + courtType,
						data: courtType,
						success: function (data) {
							var html = '';
							var len = data.length;

							if (len > 0) {
								//html += '<option value="0"> Choose</option>';
								for (var i = 0; i < len; i++) {
									html += '<option value="' + data[i].id + '">' + data[i].typeOfCase + '</option>';
								}
								$("#typeOfCase").html(html);

							} else {
								html += '<option value="0">-- Select --</option>';
								$("#typeOfCase").html(html);
								alert("check  kar hai");
								// ✅ Set selected value after populating
								if (typeOfCase1 != '0') {
									$("#typeOfCase").val(typeOfCase1);
								}
							}
						}
					});
				});

				// Trigger change after binding
				$('#typeOfCaseType').trigger('change');
			});
		</script>

		<script type="text/javascript">
			$(function () {
				$("#courtCaseNo2").keypress(
					function (e) {
						var keyCode = e.keyCode || e.which;

						$("#lblError1").html("");

						//Regex for Valid Characters i.e. Numbers.
						var regex = /^[0-9a-zA-Z]+$/;

						//Validate TextBox value against the Regex.
						var isValid = regex.test(String
							.fromCharCode(keyCode));
						if (!isValid) {
							$("#lblError1").html(
								"Please enter only numeric value.");
						}

						return isValid;
					});
			});

			$(function () {
				$("#courtCaseNo3").keypress(
					function (e) {
						var keyCode = e.keyCode || e.which;

						$("#lblError3").html("");

						//Regex for Valid Characters i.e. Numbers.
						var regex = /^[0-9]+$/;

						//Validate TextBox value against the Regex.
						var isValid = regex.test(String
							.fromCharCode(keyCode));
						if (!isValid) {
							$("#lblError3").html(
								"Please enter only numeric value.");
						}

						return isValid;
					});
			});
		</script>

  <script type="text/javascript">
  document.addEventListener("DOMContentLoaded", function () {
      const selectedId = document.getElementById("selectedSfioAsId").value;
      const allowedIds = [1, 2, 3, 4];

      allowedIds.forEach(function (id) {
          const radio = document.getElementById("inlineRadio" + id);
          if (radio) {
              radio.disabled = false;
              if (radio.value === selectedId) {
                  radio.checked = true;
              }
          }
      });

      // Disable any other radio buttons outside allowedIds (optional safety)
      document.querySelectorAll('input[name="inlineRadioOptions"]').forEach(function (radio) {
          if (!allowedIds.includes(parseInt(radio.value))) {
              radio.disabled = true;
          }
      });
  });
