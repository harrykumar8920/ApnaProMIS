# Set the root logger level to DEBUG and associate it with the console appender
log4j.rootLogger=DEBUG, console

# Define the console appender and specify the layout
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.Target=System.out
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{ISO8601} [%t] %-5p %c{1}:%L - %m%n

# Optionally, set up a file appender (if needed)
# log4j.appender.file=org.apache.log4j.FileAppender
