<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorator="layout/layout" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">


<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>Add New Status</title>
</head>

<body>

	<div layout:fragment="content">

		<div class="row pt-2 pb-2">
			<!-- <div class="col-sm-9">
				<h5 class="page-title"></h5>
			</div> -->
			<div class="col-sm-3">
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a href="">Home</a></li>
					<li class="breadcrumb-item active" aria-current="page">Add New
						Task</li>
				</ol>
			</div>
		</div>


		<form th:action="@{/addNewstatus}" method="post"
			class="needs-validation" >
			
			<div th:if="${message}" class="alert alert-success alert-dismissible"
				role="alert">
				<button type="button" class="close" data-dismiss="alert">&times;</button>
				<div class="alert-icon">
					<i class="fa fa-check"></i>
				</div>
				<div class="alert-message">
					<span th:text="${message}"></span>
				</div>
			</div>

			<div class="row">
				<div class="col-lg-12">
					<div class="card">
						<div class="card-body">
							<h4 class="form-header text-uppercase">
								<i class="fa fa-sitemap"></i> Create Task
							</h4>

							<div class="form-group row">

								<label for="input-16" class="col-sm-2 col-form-label">Task
									Name <span class="text-danger">*</span>
								</label>
                                
                                <div class="col-sm-4">
									<select class="form-control" th:field="*{taskspuh}" id="taskspuh">
									<option th:value="0" th:utext="Choose" />
										<option th:each="task:${taskspuh}" th:value="${task.id}"
											th:utext="${task.task}" />
									</select>
								</div>


								<label for="input-10" class="col-sm-2 col-form-label">Task
									Description <span class="text-danger">*</span>
								</label>
								<div class="col-sm-4">
									<input type="text" class="inputTxt form-control"
										autocomplete="off" id="" name=""
										placeholder="Task Description"
										required="required" maxlength="40" /> 
								</div>
							</div>
							
							<div class="form-group row">


								<label for="input-10" class="col-sm-2 col-form-label">Court
									Type <span class="text-danger">*</span>
								</label>
								<div class="col-sm-4">
									<select class="form-control" th:field="*{courtType}" id="courtType">
									<option th:value="0" th:utext="Choose" />
										<option th:each="court:${courtType}" th:value="${court.id}"
											th:utext="${court.courtName}" />
									</select> <span class="text-danger" th:errors="*{courtType}"></span>
								</div>
								
								<label for="input-16" class="col-sm-2 col-form-label">Investigation Unit
									 <span class="text-danger">*</span>
								</label>
								 <div class="col-sm-4">
									<select class="form-control" th:field="*{udetails}" id="udetails">
									<option th:value="0" th:utext="Choose" />
										<option th:each="udtls:${udetails}" th:value="${udtls.unitId}"
											th:utext="${udtls.unitName}" />
									</select> 
								</div>
								
								
								
								<!-- <div class="col-sm-4">
									<select class="form-control" id="type">
										<option value="0">Choose Unit</option>
										<option value="C">Unit 1</option>
										<option value="A">Unit 2</option>
									</select> 
								</div> -->

							</div>
							

							<div class="col-sm-4">
								
									<button type="submit" class="btn btn-success">
										<i class="fa fa-plus"></i> Add
									</button>
								

							
									<button type="submit" class="btn btn-success">
										<i class="fa fa-plus"></i> UPDATE
									</button>
								
								<button type="reset" class="btn btn-danger">
									<i class="fa fa-times"></i> CANCEL
								</button>
							</div>




						</div>
					</div>
				</div>
			</div>

		</form>
		<div class="row">
			<div class="col-lg-12">
				<div class="card">
					<div class="card-body">
						<h4 class="form-header text-uppercase">
							<i class="fa fa-user"></i> Task List
						</h4>

						<div class="form-group row">
							<table class="table table-striped table-bordered" id="desigTable">
								<thead class="bg-info text-white">
									<tr>
										<th>S.No.</th>
										<th>Task Name</th>
										<th>Court Description</th>
										<th>Court Type</th>
										<th>Investigation Unit</th>
										
										<!-- <th>Action</th> -->

									</tr>
								</thead>
								<tbody>
									
								</tbody>

							</table>
						</div>


					</div>

				</div>
			</div>
		</div>


		<script src="plugins/bootstrap-datatable/js/jquery.dataTables.min.js"></script>
		<script
			src="plugins/bootstrap-datatable/js/dataTables.bootstrap4.min.js"></script>
		<script type="text/javascript">
		$(document).ready(function(){
			
			 var table = $('#desigTable').DataTable( {
//		 	        lengthChange: false,
			        buttons: [ 'copy', 'excel', 'pdf', 'print', 'colvis' ]
			      } );
		});
		
		</script>

	</div>

</body>
</html>
