<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="layout/layout" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">


<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>Add New Charge</title>
</head>

<body>

	<div layout:fragment="content">

		<div class="row pt-2 pb-2">
			<!-- <div class="col-sm-9">
				<h5 class="page-title"></h5>
			</div> -->
			<div class="col-sm-3">
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a href="">Home</a></li>
					<li class="breadcrumb-item active" aria-current="page">Add New
						Charge</li>
				</ol>
			</div>
		</div>

		<div th:if="${message}" class="alert alert-success alert-dismissible"
			role="alert">
			<button type="button" class="close" data-dismiss="alert">&times;</button>
			<div class="alert-icon">
				<i class="fa fa-check"></i>
			</div>
			<div class="alert-message">
				<span th:text="${message}"></span>
			</div>
		</div>


		<form th:action="@{/addNewCharge}" method="post"
			class="needs-validation" th:object="${addCharge}" autocomplete="off">
			<input type="hidden" th:field="*{id}">


			<div class="row">
				<div class="col-lg-12">
					<div class="card">
						<div class="card-body">
							<h4 class="form-header text-uppercase">
								<i class="fa fa-address-book-o"></i> Add Charge
							</h4>
							<div class="form-group row">
								<label for="input-10" class="col-sm-2 col-form-label">Charge
									Name <span class="text-danger">*</span>
								</label>
								<div class="col-sm-4">
									<input type="text" class="form-control" autocomplete="off"
										th:field="*{chargeName}" id="chargeName" name="chargeName"
										placeholder="Enter charge Name" maxlength="50"><span
										class="text-danger"
										th:if="${#fields.hasErrors('chargeName')}"
										th:errors="*{chargeName}"></span>
										

								</div>
							</div>








							<div class="form-footer">
								<button type="reset" class="btn btn-danger">
									<i class="fa fa-times"></i> Reset
								</button>
								<th:block th:if="*{id == null}">
									<button type="submit" class="btn btn-success" id="update_btn">
										<i class="fa fa-check-square-o"></i> SAVE
									</button>
								</th:block>
								<th:block th:if="*{id != null}">
									<button type="submit" class="btn btn-success" id="update_btn">
										<i class="fa fa-check-square-o"></i> UPDATE
									</button>
								</th:block>
							</div>
						</div>
					</div>
				</div>
			</div>
		</form>

		<div class="row">
			<div class="col-lg-12">
				<div class="card">
					<div class="card-header">
						<i class="fa fa-table"></i> CHARGE DETAILS
					</div>
					<div class="card-body">
						<div class="table-responsive">
							<table id="userTable" class="table table-bordered">
								<thead>
									<tr>
										<th>S.No.</th>
										<th>Charge</th>
										<th>Action</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="p,stats: ${chargelst}">
										<td th:text="${stats.count}"></td>

										<td class="text-wrap" th:text="${p.chargeName}"></td>

										<td>
											<form th:action="@{/editCharge}" method="post"
												autocomplete="off">


												<button type="submit" th:name="editcharge"
													class="btn btn-success text-wrap" th:value="${p.id}">Edit</button>
											</form>
										</td>


									</tr>
								</tbody>

							</table>
						</div>


					</div>

				</div>
			</div>
		</div>
		<script src="plugins/bootstrap-datatable/js/jquery.dataTables.min.js"></script>
		<script
			src="plugins/bootstrap-datatable/js/dataTables.bootstrap4.min.js"></script>

		<script src="plugins/bootstrap-datatable/js/jquery.d.min.js"></script>
		<script
			src="plugins/bootstrap-datatable/js/dataTables.bootstrap4.min.js"></script>
		<script src="plugins/bootstrap-datatable/js/jquery.dataTables.min.js"></script>
		<script
			src="plugins/bootstrap-datatable/js/dataTables.bootstrap4.min.js"></script>
		<script src="plugins/bootstrap-datatable/js/dataTables.buttons.min.js"></script>



		<script type="text/javascript">
			$(document).ready(function() {
				var table = $('#userTable').DataTable({
					//		 	        lengthChange: false,
					buttons : [ 'copy', 'excel', 'pdf', 'print', 'colvis' ]
				});
			});

			/* $('#uiDob').datepicker({x
				autoclose : true,
				todayHighlight : true,
				format : 'dd/mm/yyyy',
			});

			$('#uiJoiningDate').datepicker({
				autoclose : true,
				todayHighlight : true,
				format : 'dd/mm/yyyy',
			}); */
		</script>

		<script type="text/javascript" src="js/customValidation.js"></script>


	</div>

</body>
</html>
