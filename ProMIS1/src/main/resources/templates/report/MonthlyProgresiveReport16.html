<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="layout/layout" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">




<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<link rel="stylesheet" href="css/bootstrap-datetimepicker.min.css">
<link href="css/bootstrap-datetimepicker-build.css" rel="stylesheet" />
<title>Monthly Progressive Report</title>
</head>

<body>

	<div layout:fragment="content">

		<div class="row pt-2 pb-2">
			<div class="col-sm-8">
				<h5 class="page-title">Monthly Progressive Report-Point 16</h5>
			</div>
			<div class="col-sm-4">
				<ol class="breadcrumb">
					<li th:if="${userRole=='ROLE_PROSECUTORUNITHEAD'}" class="breadcrumb-item"><a href="puhHome">Home</a></li>
					
					
					<li th:if="${userRole=='ROLE_PUH_STAFF'}" class="breadcrumb-item"><a href="puhStaffhome">Home</a></li>
					

				</ol>
			</div>
		</div>


		<form th:action="@{/monthlyProgresiveReport160}"
			th:object="${reportWeeklyInput}" method="post">

			<div class="row">
				<div class="col-lg-12">
					<div class="card">
						<div class="card-body">

							<div class="form-group row">
								<label class="control-label" id="fromDate">From Date</label>
								<div class="col-sm-2">
									<input class="form-control" type="text" th:field="*{date}"
										placehoder="Start Date" id="startdate" required="required" />

								</div>


								<label class="control-label" id="toDate">To Date </label>
								<div class="col-sm-2">
									<input class="form-control" th:field="*{toDate}" type="text"
										placehoder="End Date" id="enddate" required="required" />
								</div>
								<!-- 	<label for="input-10" class="col-sm-1 col-form-label">Accuse Status
																		<span class="text-danger">*</span>
																	</label>
																	<div class="col-sm-2">
																		<select class="form-control"
																			th:field="*{accusedstatus}">
																			<option value="0">Choose status</option>
																			<option th:each="stlst: ${statusLst}"
																				th:value="${stlst.id}"
																				th:utext="${stlst.statusName}" />
																		</select>

																	</div> -->
								<div class="col-sm-4">

									<Button class="btn btn-success" type="submit">
										<i class="ace-icon fa fa-check bigger-110"></i> Submit
									</Button>
									&nbsp; &nbsp; &nbsp;
									<button class="btn btn-warning" type="reset">
										<i class="ace-icon fa fa-undo bigger-110"></i> Reset
									</button>


									&nbsp; &nbsp; &nbsp;
									<a th:if="${userRole=='ROLE_PROSECUTORUNITHEAD'}"
										href="puhHome"><i
										class="ace-icon fa fa-arrow-left bigger-110 btn btn-danger ">Back</i></a>

									<a th:if="${userRole=='ROLE_PUH_STAFF'}" href="puhStaffhome"><i
										class="ace-icon fa fa-arrow-left bigger-110 btn btn-danger ">Back</i></a>
								</div>
							</div>

							<h4>
								<span th:text="${message}"></span>
							</h4>

							<div class="table-responsive">
								<table class="table table-bordered" id="summonDetailsTable">
									<thead class="bg-info">
										<tr>
											<th class="text-wrap">S.No.</th>
											<th class="text-wrap">Investigation Name</th>
											<th class="text-wrap">Case No.</th>
											<th class="text-wrap">Cause Title</th>
											<th class="text-wrap">Name of the Accused</th>
											<th class="text-wrap">Date of Filing</th>
											<th class="text-wrap">Financial Year</th>
											<th class="text-wrap">Name of the Courts</th>
											<th class="text-wrap">Next Date of Hearing</th>
											<th class="text-wrap">Counsel Name : Mobile</th>
											<th class="text-wrap">Present Position</th>






										</tr>
									</thead>
									<tbody>





										<tr th:each="detail,iStat :${courtCasedtl}" th:if="${detail.procourtdtl.typeOfCase.id==35}">
											<!-- <th:block
												th:if="${detail.procourtdtl.addCase.typeOfCase.id==35}"> -->

												<td th:text="${iStat.count}"></td>

												<td class="text-wrap"
													th:text="${detail.procourtdtl.addCase.caseTitle} ? ${detail.procourtdtl.addCase.caseTitle} : NA"></td>
												<td class="text-wrap"
													th:text="${detail.procourtdtl.courtCaseNo} ? ${detail.procourtdtl.courtCaseNo} : NA"></td>
												<td class="text-wrap"
													th:text="${detail.procourtdtl.causeTitle} ? ${detail.procourtdtl.causeTitle} : NA"></td>


												<td class="text-wrap"><span
													th:if="${#lists.isEmpty(detail.lst)}"> <span>NA
													</span>
												</span> <span th:unless="${#lists.isEmpty(detail.lst)}"> <span
														th:each="sumType,rowStat : ${detail.lst}"> <span
															th:text="${sumType.addAccused.accusedName+'---'+sumType.addAccused.accusedType}">
														</span><br>
													</span></span></td>

												<td class="text-wrap"
													th:text="${#dates.format(detail.procourtdtl.fillingDate, 'dd/MM/yyyy')} ? ${#dates.format(detail.procourtdtl.fillingDate, 'dd/MM/yyyy')} : NA"></td>

												<td class="text-wrap"
													th:text="${detail.procourtdtl.financialYear} ? ${detail.procourtdtl.financialYear} : NA "></td>
												<td class="text-wrap"
													th:text="${detail.procourtdtl.courtType.courtName} ? ${detail.procourtdtl.courtType.courtName} : NA "></td>

												<td class="text-wrap"
													th:text="${#dates.format(detail.nextHearingDate, 'dd/MM/yyyy')} ? ${#dates.format(detail.nextHearingDate, 'dd/MM/yyyy')} : NA"></td>
												
												<td class="text">
												    <span th:text="${detail.counselName.name}"></span> :
												    <span th:text="${detail.counselName.mobile ?: 'NA'}"></span>
												</td>
													
													<td class="text-wrap"><span
													th:if="${#lists.isEmpty(detail.lst)}"> <span>NA
													</span>
												</span> <span th:unless="${#lists.isEmpty(detail.lst)}"> <span
														th:each="sumType,rowStat : ${detail.lst}"> <span
															th:text="${sumType.caseStatus.statusName}"> </span><br>
													</span>
												</span></td>


											<!-- </th:block> -->
										</tr>


									</tbody>

								</table>




							</div>



						</div>
					</div>
				</div>
			</div>
		</form>
		<script src="plugins/bootstrap-datatable/js/jquery.dataTables.min.js"></script>
		<script
			src="plugins/bootstrap-datatable/js/dataTables.bootstrap4.min.js"></script>
		<script src="plugins/bootstrap-datatable/js/dataTables.buttons.min.js"></script>
		<script src="plugins/bootstrap-datatable/js/buttons.bootstrap4.min.js"></script>
		<script src="plugins/bootstrap-datatable/js/jszip.min.js"></script>
		<script src="plugins/bootstrap-datatable/js/pdfmake.min.js"></script>
		<script src="plugins/bootstrap-datatable/js/vfs_fonts.js"></script>
		<script src="plugins/bootstrap-datatable/js/buttons.html5.min.js"></script>
		<script src="plugins/bootstrap-datatable/js/buttons.print.min.js"></script>
		<script src="plugins/bootstrap-datatable/js/buttons.colVis.min.js"></script>
		<script type="text/javascript">
			$(document)
					.ready(
							function() {
								$("#startdate")
										.datepicker({

											format : 'dd-mm-yyyy',
											endDate : new Date(),
										// autoclose: true,
										})
										.on(
												'changeDate',
												function(selected) {
													var minDate = new Date(
															selected.date
																	.valueOf());
													var seven_date = minDate
															.getDate() + 7;
													var curr_month = minDate
															.getMonth();

													var curr_year = minDate
															.getFullYear();
													var sevenDate = (seven_date
															+ "/" + curr_month
															+ "/" + curr_year);
													$('#enddate').datepicker(
															'setStartDate',
															minDate);
												});

								/* $(
										'#enddate')
										.datepicker(
												'setStartDate',
												minDate);
								});  */

								$("#enddate").datepicker({
									format : 'dd-mm-yyyy',
								//endDate : new Date(),

								}).on(
										'changeDate',
										function(selected) {
											var minDate = new Date(
													selected.date.valueOf());

											$('#startdate').datepicker(
													'setEndDate', minDate);
										});

								var table = $('#summonDetailsTable')
										.DataTable(
												{
													//		 	        lengthChange: false,
													dom : 'Bfrtip',
													/* buttons: [
													    'copyHtml5',
													    'excelHtml5',
													    'csvHtml5',
													    'pdfHtml5'
													] */
													buttons : {
														buttons : [
																{
																	extend : 'excel',
																	text : '<i class="fa fa-print"></i> Excel',
																	title : $(
																			'h4')
																			.text(),

																	exportOptions : {
																		columns : ':not(.no-print)'
																	},
																	footer : true,
																	autoPrint : false
																},
																/* {
																      extend: 'print',
																      
																		
																      text: '<i class="fa fa-print"></i> Print',
																   
																      title: $('h4').text(),
																      exportOptions: {
																        columns: ':not(.no-print)'
																      },
																      footer: true,
																      autoPrint: false
																    }, */{
																	//  extend: 'pdf',
																	extend : 'pdfHtml5',
																	orientation : 'landscape',
																	pageSize : 'LEGAL',
																	text : '<i class="fa fa-file-pdf-o"></i> PDF',
																	title : $(
																			'h4')
																			.text(),

																	exportOptions : {
																		columns : ':not(.no-print)'
																	},
																	footer : true
																} ],

														dom : {
															container : {
																className : 'dt-buttons'
															},
															button : {
																className : 'btn btn-default'
															}
														}
													}
												});
							});
		</script>




	</div>
</body>
</html>
