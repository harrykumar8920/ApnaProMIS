<body>

			</div>
			<div class="col-sm-4">
				<ol class="breadcrumb">

			</div>

								</div>
								<div class="col-sm-4">

									<Button class="btn btn-success" type="submit">
										<i class="ace-icon fa fa-check bigger-110"></i> Submit
									</Button>
									&nbsp; &nbsp; &nbsp;
									<button class="btn btn-warning" type="reset">
										<i class="ace-icon fa fa-undo bigger-110"></i> Reset
									</button>


									&nbsp; &nbsp; &nbsp;
									<button class="btn btn-danger" type="button"
										><a href="puhHome"><i class="ace-icon fa fa-arrow-left bigger-110 ">Back</i></a>
										
									</button>
								</div>
							</div>

									</button>
								</div>
							</div>

			<h4>
				<span th:text="${message}"></span>
			</h4>				

<div class="table-responsive">
							<table class="table table-bordered" id="summonDetailsTable">
									<thead class="bg-info">
										<tr>
											<th class="text-wrap">S.No.</th>
											<th class="text-wrap">Name of Company</th>
											<th class="text-wrap">Date of Instructions</th>
												<th class="text-wrap">PROVISION OF COMPANIES ACT, 2013</th>
												<th class="text-wrap">NCLT Bench</th>
												
											<th class="text-wrap">Remarks</th>
											
											


										</tr>
									</thead>
									<tbody>
									
									
										
									
									
									 <tr th:each="detail,iStat :${courtCasedtl}">
											<td th:text="${iStat.count}"></td>
												
												
										 <td class="text-wrap" th:text="${detail.procourtdtl.causeTitle}"></td>
											<td class="text-wrap" th:text="${#dates.format(detail.nextHearingDate, 'dd/MM/yyyy')}"></td>
											
											
											
											 <td class="text-wrap">
											
											<span th:each="sumType : ${detail.sections}">
											
											<span th:text="${sumType.section}"> </span>
												<br></span>
												</td> 
												
												<th:block th:else="${detail.procourtdtl.addCase.benchName.id==0}">
												<td class="text-wrap" th:text="${detail.procourtdtl.addCase.benchName.bench}"></td>
												</th:block>
												
													<td class="text-wrap" th:text="${#dates.format(detail.procourtdtl.fillingDate, 'dd/MM/yyyy')}"></td>
												
												<!-- <td class="text-wrap" th:text="${detail.remarks}"></td> -->
												
											



										</tr> 


									</tbody>

								</table>


									
							
							</div>



						</div>
					</div>
				</div>
			</div>
		</form>
