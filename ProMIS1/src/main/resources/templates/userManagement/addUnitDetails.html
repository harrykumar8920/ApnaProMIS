<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="layout/layout" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>Add New Unit</title>
</head>

<body>

	<div layout:fragment="content">

		<div class="row pt-2 pb-2">
			<!-- <div class="col-sm-9">
				<h5 class="page-title"></h5>
			</div> -->
			<div class="col-sm-3">
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a href="home">Home</a></li>
					<li class="breadcrumb-item active" aria-current="page">Add New
						Unit</li>
				</ol>
			</div>
		</div>


		<form th:action="@{/addNewUnit}" method="post"
			class="needs-validation" th:object="${unitDetails}"
			autocomplete="off">
             
                 <input type="hidden" th:field = "*{unitId}" >
			<div th:if="${message}" class="alert alert-success alert-dismissible" role="alert">
				<button type="button" class="close" data-dismiss="alert">&times;</button>
				<div class="alert-icon">
					<i class="fa fa-check"></i>
				</div>
				<div class="alert-message">
					<span th:text="${message}"></span>
				</div>
			</div>

			<div class="row">
				<div class="col-lg-12">
					<div class="card">
						<div class="card-body">
							<h4 class="form-header text-uppercase">
								<i class="fa fa-address-book-o"></i> Unit Information
							</h4>
							<div class="form-group row">

								<label for="input-10" class="col-sm-2 col-form-label">Unit
									Name <span class="text-danger" >*</span></label>
								<div class="col-sm-4">
									<input type="text" class="form-control" th:field="*{unitName}"
										autocomplete="off" placeholder="Enter Unit Name" maxlength="20">
									<span class="text-danger"
										th:if="${#fields.hasErrors('unitName')}"
										th:errors="*{unitName}">Unit Name Error</span>
								</div>

								<label for="input-10" class="col-sm-2 col-form-label">
									Unit Location <span class="text-danger" >*</span> </label>
								<!-- <div class="col-sm-4">
									<input type="text" class="form-control" autocomplete="off"
										id="location" name="location" th:field="*{location}"
										placeholder="Enter Location" maxlength="40"> <span
										class="text-danger" th:if="${#fields.hasErrors('location')}"
										th:errors="*{location}">Unit Location Error</span>
								</div> -->
								
									<div class="col-sm-4">

									<select class="form-control" th:field="*{location}" th:id = "location">
									<option value="0">Choose location</option>
										<option th:each="loc: ${listunitloc}"
											th:value="${loc.id}" th:utext="${loc.location}" />
									</select> <span class="text-danger"
										th:if="${#fields.hasErrors('location')}"
										th:errors="*{location}"></span>
								</div>
							</div>
							<div class="form-group row">
								<label for="input-11" class="col-sm-2 col-form-label">
									Unit Address <span class="text-danger" >*</span></label>
								<div class="col-sm-10">
									<input type="text" class="form-control" autocomplete="off"
										id="address" name="address" th:field="*{address}"
										placeholder="Enter Unit Address" maxlength="200" readonly="readonly"> <span
										class="text-danger" th:if="${#fields.hasErrors('address')}"
										th:errors="*{address}">Address Error</span>
								</div>

							</div>

							<div class="form-group row">

								<label for="input-16" class="col-sm-2 col-form-label">Telephone
									No <span class="text-danger">*</span></label>
								<div class="col-sm-4">
									<input type="text" class="form-control"
										th:field="*{telephoneNo}" id="telephoneNo" name="telephoneNo"
										placeholder="Enter Telephone No" maxlength="12"> <span
										class="text-danger"
										th:if="${#fields.hasErrors('telephoneNo')}"
										th:errors="*{telephoneNo}">Unit Name Error</span>
								</div>

								<label for="input-16" class="col-sm-2 col-form-label">Fax
									Number <span class="text-danger" >*</span></label>
								<div class="col-sm-4">
									<input type="text" class="form-control" th:field="*{faxNo}"
										id="faxNo" name="faxNo" placeholder="Enter Fax No" maxlength="12"> <span
										class="text-danger" th:if="${#fields.hasErrors('faxNo')}"
										th:errors="*{faxNo}">Fax Error</span>
								</div>
							</div>

							<div class="form-group row">
								<label for="input-16" class="col-sm-2 col-form-label">Office
									E-mail</label>
								<div class="col-sm-4">
									<input type="text" class="form-control" th:field="*{eMail}"
										id="eMail" name="eMail" placeholder="Enter E-Mail" maxlength="50"> <span
										class="text-danger" th:if="${#fields.hasErrors('eMail')}"
										th:errors="*{eMail}" >Email Error</span>
								</div>
							</div>

							<div class="form-footer">
								<button type="reset" class="btn btn-danger">
									<i class="fa fa-times"></i> RESET
								</button>
								<th:block th:if="${unitDetails.editUnit == false}">
								<button type="submit" class="btn btn-success">
									<i class="fa fa-check-square-o"></i> SAVE
								</button>
								</th:block>
								<th:block th:if="${unitDetails.editUnit == true}">
								<button type="submit" class="btn btn-success">
									<i class="fa fa-check-square-o"></i> UPDATE
								</button>
								</th:block>
							</div>
						</div>
					</div>
				</div>
			</div>
		</form>
<div class="row">
			<div class="col-lg-12">
				<div class="card">
					<div class="card-body">
						<h4 class="form-header text-uppercase">
							<i class="fa fa-user"></i> Unit Details
						</h4>
							<div class="form-group row">
								<table class="table table-responsive" id = "unitTable">
									<thead class="bg-info text-white">
										<tr>
											<th>S.No.</th>
											<th>Name</th>
											<th>Location</th>
											<th>address</th>
											<th>Official Email</th>
											<th>Contact No.</th>
											<th>Fax No.</th>
										</tr>
									</thead>
									<tbody>
									 <tr th:each="p,stats: ${unitList}">
											<td th:text="${stats.count}"></td> 
											<td class="text-wrap" th:text="${p.unitName}"></td>
											<td class="text-wrap" th:text="${p.location.location}"></td>
											<td class="text-wrap" th:text="${p.address}"></td>
											<td class="text-wrap" th:text="${p.eMail}"></td>
											<td class="text-wrap" th:text="${p.telephoneNo}"></td>
											<td class="text-wrap" th:text="${p.faxNo}"></td>
											
										</tr> 
									</tbody>

								</table>
							</div>
					

					</div>

				</div>
			</div>
		</div>

		<!-- <script type="text/javascript">
			$('#dob').datepicker({
				autoclose : true,
				todayHighlight : true,
				format : 'dd/mm/yyyy',
			});

			$('#joiningDate').datepicker({
				autoclose : true,
				todayHighlight : true,
				format : 'dd/mm/yyyy',
			});
		</script> -->


	<script src="plugins/bootstrap-datatable/js/jquery.dataTables.min.js"></script>
		<script src="plugins/bootstrap-datatable/js/dataTables.bootstrap4.min.js"></script>
		<script type="text/javascript">
		$(document).ready(function(){
			
			 var table = $('#unitTable').DataTable( {
//		 	        lengthChange: false,
			        buttons: [ 'copy', 'excel', 'pdf', 'print', 'colvis' ]
			      } );
		});
		
		
		 $('#location').blur(function(){
			 var token = $("input[name=_csrf]").val();
			 var header = 'X-CSRF-TOKEN';
			 $(document).ajaxSend(function(e, xhr, options)
			   {
				 xhr.setRequestHeader(header,token );
			   }), 
			  
			$.ajax({
			      type : "post",
			      url : "getlocaddress?Id="+$(this).val(),
//	 		      data : {editDeleteId:id},
			      contentType : "application/json; charset=utf-8",
			      success : function(data) {
			    	 
			    	  $('#address').val(data)
			      }
			    }); 
		 });
		
		</script>


	</div>

</body>
</html>
