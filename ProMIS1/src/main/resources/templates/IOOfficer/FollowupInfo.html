		<div th:if="${message}" class="alert alert-success alert-dismissible"

			<div class="alert-icon">

			</div>
			<div class="alert-message">

			</div>

		<form th:action="@{/addNewUser}" method="post"

			<div class="row">
				<div class="col-lg-12">

							<div class="form-group row">

								<label class="col-sm-2 col-form-label"> Case No : </label> <label

								</label> <label class="col-sm-2 col-form-label">Case Title :</label> <label
									class="col-sm-4 col-form-label text-primary"> <span>CALCOM
										CEMENT INDIA LTD</span>
								</label>


							</div>



							<h4 class="form-header text-uppercase">
								<i class="fa fa-address-book-o"></i> Follow-up Details/Further action
							</h4>


							

							<div class="form-group row">
								<label for="input-16" class="col-sm-2 col-form-label">Date
									<span class="text-danger">*</span>
								</label>
								<div class="col-sm-4">
									<input type="text" class="form-control" id="uiDob" name="uiDob"
										placeholder="DD/MM/YYYY" maxlength="10">
								</div>
								<label for="input-10" class="col-sm-2 col-form-label">Letter send to minister for clarification /Request to IO to provide Inputs
									<span class="text-danger">*</span>
								</label>
								<div class="col-sm-4">
									<input type="file"  class="form-control" >
									</div>



							</div>







							<div class="form-footer">
								<button type="reset" class="btn btn-danger">
									<i class="fa fa-times"></i> Reset
								</button>
								<button type="submit" class="btn btn-success" id="update_btn">
									<i class="fa fa-check-square-o"></i> SAVE
								</button>
								
								<a class ="btn btn-dark" href="AdditionalInfo"> <i class="fa fa-check-square-o"></i> Back</a>
							</div>
						</div>
					</div>
				</div>
			</div>
		</form>
