		<div class="row pt-2 pb-2">

			<div class="col-sm-3">
				<ol class="breadcrumb">

					<li class="breadcrumb-item active" aria-current="page">Add
						CGSC Details</li>
				</ol>
			</div>
		</div>

		<div th:if="${message}" class="alert alert-success alert-dismissible"
			role="alert">
			<button type="button" class="close" data-dismiss="alert">&times;</button>
			<div class="alert-icon">
				<i class="fa fa-check"></i>
			</div>
			<div class="alert-message">
				<span th:text="${message}"></span>
			</div>
		</div>


		<form th:action="@{/addNewUser}" method="post"
			class="needs-validation" autocomplete="off">


			<div class="row">
				<div class="col-lg-12">
					<div class="card">
						<div class="card-body">


							<div class="form-group row">

								<label class="col-sm-2 col-form-label"> Case No : </label> <label
									class="col-sm-4 col-form-label text-primary"> <span>SFIO/INV/CCIL/1201-1207/2019/</span>
								</label> <label class="col-sm-2 col-form-label">Case Title :</label> <label
									class="col-sm-4 col-form-label text-primary"> <span>CALCOM
										CEMENT INDIA LTD</span>
								</label>


							</div>



							<h4 class="form-header text-uppercase">
								<i class="fa fa-address-book-o"></i> CGSC Details
							</h4>

							<div class="form-group row">
								<label for="input-11" class="col-sm-2 col-form-label">
									Name </label>
								<div class="col-sm-4">
									<input type="text" class="form-control" autocomplete="off"
										id="middleName" name="middleName" placeholder="Enter  Name"
										maxlength="50">
								</div>

								<label for="input-12" class="col-sm-2 col-form-label">Address</label>
								<div class="col-sm-4">
									<input type="text" class="form-control" autocomplete="off"
										id="lastName" name="lastName" placeholder="Enter Address"
										maxlength="50">
								</div>

							</div>

							<div class="form-group row">
								<label for="input-10" class="col-sm-2 col-form-label">Email
									<span class="text-danger">*</span>
								</label>
								<div class="col-sm-4">
									<input type="text" class="form-control" autocomplete="off"
										id="firstName" name="firstName" placeholder="Enter Email"
										maxlength="50">
								</div>

								<label for="input-16" class="col-sm-2 col-form-label">
									Prosecutor Mobile Number <span class="text-danger">*</span>
								</label>
								<div class="col-sm-4">
									<input type="text" class="form-control" name="contactnumber"
										id="mobileNo" placeholder="Enter Mobile No" maxlength="10"
										onblur="checkMobile()">
								</div>


							</div>





							<div class="form-footer">
								<button type="reset" class="btn btn-danger">
									<i class="fa fa-times"></i> Reset
								</button>

								<button type="submit" class="btn btn-success" id="update_btn">
									<i class="fa fa-check-square-o"></i> SAVE
								</button>
								<a class="btn btn-dark" href="AdditionalInfo"> <i
									class="fa fa-check-square-o"></i> Back
								</a>
							</div>
						</div>
					</div>
				</div>
			</div>
		</form>
