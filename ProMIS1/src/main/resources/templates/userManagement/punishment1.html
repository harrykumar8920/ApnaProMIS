<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="layout/layout" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">


<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>Punishment</title>
</head>

<body>
	<div layout:fragment="content">
		<div class="row pt-2 pb-2">
			<div class="col-sm-8">
				<h5 class="page-title">Punishment</h5>
			</div>
			<div class="col-sm-4">
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a href="home">Home</a></li>
					<li class="breadcrumb-item"><a href="#">Punishment</a></li>

				</ol>
			</div>
		</div>
		<div class="card">

			<div class="card-body">
				<form th:action="@{/savePunishment}" method="post" class="needs-validation"
					th:object="${punishments}">
					<input type="hidden" th:name=${_csrf.parameterName} th:value=${_csrf.token}>
					<div th:if="${message}"
						class="alert alert-success alert-dismissible" role="alert">
						<button type="button" class="close" data-dismiss="alert">&times;</button>
						<div class="alert-icon">
							<i class="fa fa-check"></i>
						</div>
							
						<div class="alert-message">
							<span th:text="${message}"></span>
						</div>
					</div>
					<div class="row">
						<div class="col-lg-12">
							<div class="card">
								<div class="card-body">
									<h4 class="form-header text-uppercase">
										<i class="fa fa-sitemap"></i> Add Punishment
									</h4>
									<div class="form-group row">
										<label for="input-10" class="col-sm-2 col-form-label">Punishment
											Name <span class="text-danger">*</span>
										</label>
										<div class="col-sm-4">
											<input type="text" class="form-control" autocomplete="off" th:field="*{punishment1}"
												placeholder="Enter Punishment Name" maxlength="40" /> <span class="text-danger"
										th:errors="*{punishment1}"></span>
										</div>

									</div>

									<div class="form-footer">
										<button type="reset" class="btn btn-danger">
											<i class="fa fa-times"></i> Reset
										</button>

										<button type="submit" class="btn btn-success">
											<i class="fa fa-check-square-o"></i> save
										</button>

									</div>

								</div>


							</div>
						</div>
					</div>


				</form>
				<div class="form-group row">
					<table class="table table-respnsive table-bordered">
						<thead class="bg-info text-white">
							<tr>
								<th>S.No.</th>
								<th>Punishment</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="p,stats: ${list}">
								<td th:text="${stats.count}"></td>
								<td th:text="${p.punishment1}"></td>
							</tr>
						</tbody>

					</table>
				</div>

			</div>


		</div>



	</div>
</body>
</html>
