<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorator="layout/layout" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">


<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>Add New Designation</title>
</head>

<body>

	<div layout:fragment="content">

		<div class="row pt-2 pb-2">
			<!-- <div class="col-sm-9">
				<h5 class="page-title"></h5>
			</div> -->
			<div class="col-sm-3">
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a href="home">Home</a></li>
					<li class="breadcrumb-item active" aria-current="page">Add Act
						Section</li>
				</ol>
			</div>
		</div>


		<form th:action="@{/updateActSec}" method="post"
			class="needs-validation" th:object="${addActSec}">
			<input type="hidden" th:field="*{isEditActSec}">
			<div th:if="${message}" class="alert alert-success alert-dismissible"
				role="alert">
				<button type="button" class="close" data-dismiss="alert">&times;</button>
				<div class="alert-icon">
					<i class="fa fa-check"></i>
				</div>
				<div class="alert-message">
					<span th:text="${message}"></span>
				</div>
			</div>
			<div class="row">
				<div class="col-lg-12">
					<div class="card">
						<div class="card-body">
							<h4 class="form-header text-uppercase">
								<i class="fa fa-sitemap"></i> Add Act Sections
							</h4>
							<input type="hidden" th:field="*{id}">
							<div class="form-group row">
								<label for="input-10" class="col-sm-2 col-form-label">
									Act <span class="text-danger">*</span>
								</label>
								<th:block th:if="${addActSec.isEditActSec == true}">
									<div class="col-sm-4" style="display: none;">
										<select class="form-control" th:field="*{act}">
											<option th:value="0" th:utext="Choose" />
											<option th:each="acts: ${actList}" th:value="${acts.id}"
												th:utext="${acts.Act}" />
										</select> <span class="text-danger" th:errors="*{act}"></span>
									</div>
								</th:block>
								<th:block th:if="${addActSec.isEditActSec == false}">
									<div class="col-sm-4">
										<select class="form-control" th:field="*{act}">
											<option th:value="0" th:utext="Choose" />
											<option th:each="acts: ${actList}" th:value="${acts.id}"
												th:utext="${acts.Act}" />
										</select> <span class="text-danger" th:errors="*{act}"></span>
									</div>
								</th:block>
								<th:block th:if="${addActSec.isEditActSec == true}">
									<div class="col-sm-4">
										<label th:text="${addActSec.act.act}"></label>
									</div>
								</th:block>
								<label for="input-16" class="col-sm-2 col-form-label">Section
									<span class="text-danger">*</span>
								</label>
								<div class="col-sm-4">
									<input type="text" class="form-control" id="Section"
										th:field="*{Section}" name="Section"
										placeholder="Enter Section" required="required" maxlength="40">

									<span class="text-danger"
										th:if="${#fields.hasErrors('Section')}" th:errors="*{Section}"></span>
								</div>
								
							</div>
							<div class="form-group row">

								
								<label for="input-16" class="col-sm-2 col-form-label">Description
									<!-- <span class="text-danger">*</span> -->
								</label>
								<div class="col-sm-4">
									<textarea class="form-control" id="Section" name="the-textarea"
										th:field="*{description}" placeholder="Enter Description"
										rows="4" maxlength="250" autofocus></textarea>
									<div id="the-count">
										<span>Character Count-</span><span id="current"> 0</span> <span
											id="maximum">/ 250</span>
									</div>
								</div>
							</div>
							<div class="form-footer">
								<!-- <button type="reset" class="btn btn-danger">
									<i class="fa fa-times"></i> CANCEL
								</button> -->
								<th:block th:if="${addActSec.isEditActSec == false}">
									<button type="submit" class="btn btn-success">
										<i class="fa fa-check-square-o"></i> Add
									</button>
								</th:block>
								<th:block th:if="${addActSec.isEditActSec == true}">
									<button type="submit" class="btn btn-success">
										<i class="fa fa-check-square-o"></i> Update
									</button>
								</th:block>
								<a href="backButton" class="btn btn-dark">Back </a>
							</div>
						</div>
					</div>
				</div>
			</div>
		</form>
		<!-- Saurabh Changes Start -->








		<script src="plugins/bootstrap-datatable/js/jquery.dataTables.min.js"></script>
		<script
			src="plugins/bootstrap-datatable/js/dataTables.bootstrap4.min.js"></script>

			 var table = $('#desigTable').DataTable( {

			        buttons: [ 'copy', 'excel', 'pdf', 'print', 'colvis' ]
			      } );
		});
		
		</script>	 -->

		<script type="text/javascript">
			$(document).ready(function() {
				var table = $('#AddActTable').DataTable({
					//			 	        lengthChange: false,
					buttons : [ 'copy', 'excel', 'pdf', 'print', 'colvis' ]
				});
			});
		</script>
		<script type="text/javascript">
			$(document)
					.ready(
							function() {
								$('textarea')
										.keyup(
												function() {

													var characterCount = $(this)
															.val().length, current = $('#current'), maximum = $('#maximum'), theCount = $('#the-count');

													current
															.text(characterCount);

													/*This isn't entirely necessary, just playin around*/
													if (characterCount < 70) {
														current.css('color',
																'#666');
													}
													if (characterCount > 70
															&& characterCount < 90) {
														current.css('color',
																'#6d5555');
													}
													if (characterCount > 90
															&& characterCount < 100) {
														current.css('color',
																'#793535');
													}
													if (characterCount > 100
															&& characterCount < 120) {
														current.css('color',
																'#841c1c');
													}
													if (characterCount > 120
															&& characterCount < 139) {
														current.css('color',
																'#8f0001');
													}

													if (characterCount >= 140) {
														maximum.css('color',
																'#8f0001');
														current.css('color',
																'#8f0001');
														theCount.css(
																'font-weight',
																'bold');
													} else {
														maximum.css('color',
																'#666');
														theCount.css(
																'font-weight',
																'normal');
													}

												});
							})
		</script>

	</div>
</body>
</html>
