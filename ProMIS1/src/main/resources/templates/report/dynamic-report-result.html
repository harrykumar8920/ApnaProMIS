<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="layout/layout" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <title>Dynamic Report Result</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body>
<!--<div class="container mt-4">-->
	
	<div layout:fragment="content">

    <h4 class="mb-3 text-center">Dynamic Report Result</h4>

    <!-- Table -->
    <div class="table-responsive">
        <table class="table table-bordered table-striped">

            <thead class="table-dark">
            <tr>
                <th>S.No.</th>
                <th th:each="col : ${columns}" 
                    th:text="${#strings.capitalize(#strings.replace(col, '_', ' '))}"></th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="row, stat : ${data}">
                <td th:text="${stat.index + 1}"></td>
                <td th:each="cell : ${row}" th:text="${cell != null ? cell : ''}"></td>
            </tr>
            </tbody>

        </table>
    </div>

    <!-- Buttons -->
    <div class="d-flex justify-content-between mt-3">
        <!-- Back button on left -->
        <a th:href="@{/dynamic-report}" class="btn btn-secondary">Back</a>

        <!-- Export buttons on right -->
        <form th:action="@{/dynamic-report1}" method="post" class="d-inline">
            <input type="hidden" name="fromDate" th:value="${#temporals.format(fromDate, 'yyyy-MM-dd')}" />
            <input type="hidden" name="toDate" th:value="${#temporals.format(toDate, 'yyyy-MM-dd')}" />
            <input type="hidden" name="dateType" th:value="${dateType}" />
            <input type="hidden" th:each="field : ${selectedFields}" name="selectedFields" th:value="${field}" />

            <button type="submit" name="exportType" value="PDF" class="btn btn-danger mx-1">Export PDF</button>
            <button type="submit" name="exportType" value="EXCEL" class="btn btn-success mx-1">Export Excel</button>
        </form>
    </div>

</div>
</body>
</html>
