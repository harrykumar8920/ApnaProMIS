<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorator="layout/layout" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">


<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>Add New Respondent</title>
</head>

<body>

	<div layout:fragment="content">

		<div class="row pt-2 pb-2">
			<!-- <div class="col-sm-9">
				<h5 class="page-title"></h5>
			</div> -->
			<div class="col-sm-3">
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a href="">Home</a></li>
					<li class="breadcrumb-item active" aria-current="page">Add Act
						& Sections</li>
				</ol>
			</div>
		</div>

		<div th:if="${message}" class="alert alert-success alert-dismissible"
			role="alert">
			<button type="button" class="close" data-dismiss="alert">&times;</button>
			<div class="alert-icon">
				<i class="fa fa-check"></i>
			</div>
			<div class="alert-message">
				<span th:text="${message}"></span>
			</div>
		</div>


		<form th:action="@{/addNewUser}" method="post"
			class="needs-validation" autocomplete="off">


			<div class="row">
				<div class="col-lg-12">
					<div class="card">
						<div class="card-body">






							<h4 class="form-header text-uppercase">
								<i class="fa fa-address-book-o"></i> Add Act & Sections
							</h4>
							<div class="form-group row">
								<label for="input-10" class="col-sm-2 col-form-label">
									ACT <span class="text-danger">*</span>
								</label>
								<div class="col-sm-4">
									<select class="form-control" th:id="act">
										<option value="0">Select ACT</option>
										<option value="A0" class="text-danger">Add New ACT</option>
										<option value="1">Provision-1956 Act</option>
										<option value="3">Title-1956 Act</option>
										<option value="4">Provision-2013 Act</option>
										<option value="5">Title-2013 Act</option>
										<option value="6">Provision- IPC 1860</option>
										<option value="7">Title- IPC 1860</option>

									</select>
								</div>

								<label for="input-16" class="col-sm-2 col-form-label">Add
									Section </label>

								<div class="col-sm-4">
									<input type="text" class="form-control">
								</div>

							</div>

							<div class="form-group row">
								<label for="input-10" class="col-sm-2 col-form-label">
									Choose Section <span class="text-danger">*</span>
								</label>
								<div class="col-sm-4">
									<select class="form-control" th:id="Section">
										<option value="0">Select Section</option>
										
										<option value="1">Provision-1956 Section</option>
										<option value="3">Title-1956 Section</option>
										

									</select>
								</div>

								<label for="input-16" class="col-sm-2 col-form-label">Add Sub
									Section </label>

								<div class="col-sm-4">
									<input type="text" class="form-control">
								</div>

							</div>



							<div class="form-footer">
								<button type="reset" class="btn btn-danger">
									<i class="fa fa-times"></i> Reset
								</button>
								<button type="button" class="btn btn-success" id="update_btn">
									<i class="fa fa-check-square-o"></i> SAVE
								</button>

							</div>
						</div>
					</div>
				</div>
			</div>


			<div class="modal fade" id="exampleModal" tabindex="-1" role="dialog"
				aria-labelledby="exampleModalLabel" aria-hidden="true">
				<div class="modal-dialog" role="document">
					<div class="modal-content">
						<div class="modal-header">
							<h5 class="modal-title" id="exampleModalLabel">Add New Act</h5>
							<button type="button" class="close" data-dismiss="modal"
								aria-label="Close">
								<span aria-hidden="true">&times;</span>
							</button>
						</div>
						<div class="modal-body">
							<form>
								<div class="form-group">
									<label for="recipient-name" class="col-form-label">Act
										:</label> <input type="text" class="form-control" id="ActName"
										onkeypress="return (event.charCode > 64 && event.charCode < 91) || (event.charCode > 96 && event.charCode < 123) || (event.charCode==32) || (event.charCode==46)"
										maxlength="40">
								</div>

							</form>
						</div>
						<div class="modal-footer">
							<button type="button" class="btn btn-secondary"
								data-dismiss="modal">Close</button>
							<button type="button" class="btn btn-primary">Save</button>
						</div>
					</div>
				</div>
			</div>
			
				
		</form>


		<script src="plugins/bootstrap-datatable/js/jquery.dataTables.min.js"></script>
		<script
			src="plugins/bootstrap-datatable/js/dataTables.bootstrap4.min.js"></script>
		<script type="text/javascript">
			$(document).ready(function() {
				var table = $('#userTable').DataTable({
				});
			});

			$('#uiDob').datepicker({
				autoclose : true,
				todayHighlight : true,
				format : 'dd/mm/yyyy',
			});

			$('#uiJoiningDate').datepicker({
				autoclose : true,
				todayHighlight : true,
				format : 'dd/mm/yyyy',
			});
			
			
			 
			 $('#act').on('change', function() {
					
			      if ( this.value == 'A0')
			  
			      {
			    	  
			    	  
			    	   $("#exampleModal").modal("show");
			      
			      }
			      else
			      {
			        $("#AdinBlock").hide();
			      }
			    });
			
			 
		</script>

		<script type="text/javascript" src="js/customValidation.js"></script>




	</div>

</body>
</html>
