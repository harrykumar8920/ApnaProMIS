<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="layout/layout" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">


<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<link
	href="plugins/bootstrap-datatable/css/dataTables.bootstrap4.min.css"
	rel="stylesheet" type="text/css">
<link href="plugins/bootstrap-datatable/css/buttons.bootstrap4.min.css"
	rel="stylesheet" type="text/css">
<title>Pending Hearing Details</title>

</head>

<body>
	<div layout:fragment="content">
		<div class="row pt-2 pb-2">
			
			<div class="col-sm-3">
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a href="puhHome">Home</a></li>
					<li class="breadcrumb-item active" aria-current="page">Pending Hearing Details</li>
				</ol>
			</div>
		</div>
		<div class="row">
			<div class="col-lg-12">
				<div class="card">
					<div class="card-body">
						<h4 class="form-header text-uppercase">
							<i class="fa fa-address-book-o"></i> Pending Hearing Details

						</h4>


						<form th:action="@{/}" method="post" class="needs-validation">

							<div class="form-group row">
								<div class="table-responsive">
									<table id="assignedTable" class="table table-bordered table-striped">
										<thead class="bg-info text-white">
											<tr>
												<th>S.No.</th>
												<th>Cause Title</th>
												<th>Case No</th>
												<th>Company Name</th>
												<th>Next Date</th>
												<th>Name of the Prosecutor</th>
											</tr>
										</thead>
										<tbody>
										<tr th:each="obj,stat : ${byUserAndLessThanNextHearingDate}" >
											<td th:text="${stat.count}"></td>

											<td class="text-wrap" th:text="${obj.procourtdtl.causeTitle}"></td>

											<td th:text="${obj.procourtdtl.courtCaseNo}"></td>

											<td class="text-wrap" th:text="${obj.procourtdtl.addCase.caseTitle}"></td>


											<td th:text="${#dates.format(obj.nextHearingDate, 'dd-MM-yyyy')}"></td>
											<td th:text="${
											    (obj.user.salutation != null ? obj.user.salutation + ' ' : '') +
											    (obj.user.firstName != null ? obj.user.firstName + ' ' : '') +
											    (obj.user.middleName != null ? obj.user.middleName + ' ' : '') +
											    (obj.user.lastName != null ? obj.user.lastName : '')
											}"></td>
										</tr>
										</tbody>

									</table>
								</div>
							</div>
						</form>




					</div>

				</div>
			</div>
		</div>


		<!-- DataTables Core (must be loaded first) -->
		<script src="plugins/bootstrap-datatable/js/jquery.dataTables.min.js"></script>
		<script src="plugins/bootstrap-datatable/js/dataTables.bootstrap4.min.js"></script>

		<!-- Buttons Extension -->
		<script src="plugins/bootstrap-datatable/js1/dataTables.buttons.min.js"></script>
		<script src="plugins/bootstrap-datatable/js1/buttons.bootstrap4.min.js"></script>

		<!-- Dependencies for Excel -->
		<script src="plugins/bootstrap-datatable/js1/jszip.min.js"></script>

		<!-- Dependencies for PDF -->
		<script src="plugins/bootstrap-datatable/js1/pdfmake.min.js"></script>
		<script src="plugins/bootstrap-datatable/js1/vfs_fonts.js"></script>

		<!-- HTML5 Export Buttons (Excel, PDF, CSV) -->
		<script src="plugins/bootstrap-datatable/js1/buttons.html5.min.js"></script>

		<!-- Print Button -->
		<script src="plugins/bootstrap-datatable/js1/buttons.print.min.js"></script>
		<script type="text/javascript">
		    $(document).ready(function () {

		        var table = $('#assignedTable').DataTable({
		            buttons: [
		                {
		                    extend: 'excel',
		                    text: '<i class="fa fa-file-excel-o"></i> Excel',
		                    className: 'btn btn-success btn-sm'
		                },
		                {
		                    extend: 'pdf',
		                    text: '<i class="fa fa-file-pdf-o"></i> PDF',
		                    className: 'btn btn-danger btn-sm'
		                },
		                {
		                    extend: 'print',
		                    text: '<i class="fa fa-print"></i> Print',
		                    className: 'btn btn-secondary btn-sm'
		                }
		            ]
		        });

		        // ✅ IMPORTANT: Buttons ko table ke upar render karo
		        table.buttons().container()
		            .appendTo('#assignedTable_wrapper .col-md-6:eq(0)');

		    });
		</script>

	</div>

</body>
</html>
