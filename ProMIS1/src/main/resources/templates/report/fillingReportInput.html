<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="layout/layout" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">


<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<link rel="stylesheet" href="css/bootstrap-datetimepicker.min.css">
<link href="css/bootstrap-datetimepicker-build.css" rel="stylesheet" />
<title>Cause title</title>
</head>

<body>

	<div layout:fragment="content">

		<div class="row pt-2 pb-2">
			<div class="col-sm-8">
			<!--	<h5 class="page-title">Report of Filled Cases</h5>-->
			</div>
	
		</div>

		<form th:action="@{/fillingReportfetch}" th:object="${reportWeeklyInput}"
			method="post">

			<div class="row">
				<div class="col-lg-12">
					<div class="card">
						<div class="card-body">

							<div class="form-group row">
								<label class="control-label" id="fromDate">Years</label>
								<div class="col-sm-2">
								    <select class="form-control" th:field="*{years}">
										<option value="21">More than 21</option>
										<option value="1">1</option>
								        <option value="2">2</option>
								        <option value="3">3</option>
								        <option value="4">4</option>
								        <option value="5">5</option>
								        <option value="6">6</option>
								        <option value="7">7</option>
								        <option value="8">8</option>
								        <option value="9">9</option>
								        <option value="10">10</option>
								        <option value="11">11</option>
								        <option value="12">12</option>
								        <option value="13">13</option>
								        <option value="14">14</option>
								        <option value="15">15</option>
								        <option value="16">16</option>
								        <option value="17">17</option>
								        <option value="18">18</option>
								        <option value="19">19</option>
								        <option value="20">20</option>
								        
								    </select>
								</div>
								<label for="input-16" class=" col-form-label">Case
									Status 
								</label>
								<div class="col-sm-2">
									<select class="custom-select" th:field="*{caseStatus}"
										>
										<option value="0">Choose</option>
										<option th:each="s : ${statusLst1}" th:value="${s.id}"
											th:text="${s.statusName}"></option>
									</select> 
								</div>
								<!--<label class="control-label" id="fromDate">From Date</label>
								<div class="col-sm-2">
									<input class="form-control" type="text" th:field="*{date}"
										placehoder="Start Date" id="startdate" required="required" />

								</div>


								<label class="control-label" id="toDate">To Date </label>
								<div class="col-sm-2">
									<input class="form-control" th:field="*{toDate}" type="text"
										placehoder="End Date" id="enddate" required="required" />
								</div>-->
								<div class="col-sm-4">

									<Button class="btn btn-success" type="submit">
										<i class="ace-icon fa fa-check bigger-110"></i> Submit
									</Button>
									&nbsp; &nbsp; &nbsp;
									<button class="btn btn-warning" type="reset">
										<i class="ace-icon fa fa-undo bigger-110"></i> Reset
									</button>


									&nbsp; &nbsp; &nbsp; <a th:if="${userRole=='ROLE_PROSECUTORUNITHEAD'}"
										href="puhHome"><i
										class="ace-icon fa fa-arrow-left bigger-110 btn btn-danger ">Back</i></a>

									<a th:if="${userRole=='ROLE_PUH_STAFF'}" href="puhStaffhome"><i
										class="ace-icon fa fa-arrow-left bigger-110 btn btn-danger ">Back</i></a>


								</div>


							</div>

							<h4>
								<span th:text="${message}"></span>
							</h4>

							<div class="table-responsive">
								<table class="table table-bordered" id="weaklyReport">
									<thead class="bg-info">
										<tr>
											<th class="text-wrap" align="center"
												style="align-content: flex-start;">S.No.</th>
											<th class="text-wrap" align="justify">Court</th>
											<th class="text-wrap" align="justify">Company Name</th>
											<th class="text-wrap" align="justify">Case Title</th>
											<!--<th class="text-wrap" align="justify">Date Of Prosecution Senction</th>-->
											<th class="text-wrap" align="justify">Date of Filing</th>
											<th class="text-wrap" align="justify">Case Number</th>
											<!--<th class="text-wrap" align="justify"> Act</th>-->
											<th class="text-wrap">Case Stage</th>
											<th class="text-wrap">Prosecutor</th>
											<th class="text-wrap">Name of Counsel</th>
											<th class="text-wrap">CNR Number</th>
										</tr>
									</thead>
									<tbody>


										<tr th:each="detail,iStat :${courtCasedtl}">
											<td th:text="${iStat.count}"></td>
											<td class="text-wrap"
												th:text="${detail.procourtdtl.courtType.courtName}"></td>
											
												<td class="text-wrap" th:text="${detail.procourtdtl.addCase.caseTitle}"></td>
												<td class="text-wrap" th:text="${detail.procourtdtl.causeTitle}"></td>
												
												<!--<td class="text-wrap" th:text="${#dates.format(detail.procourtdtl.addCase.proSanctionDate, 'dd/MM/yyyy')}"></td>-->
												<td class="text-wrap" th:text="${#dates.format(detail.procourtdtl.fillingDate, 'dd/MM/yyyy')}"></td>
												<td class="text-wrap" th:text="${detail.procourtdtl.courtCaseNo}"></td>
												<!--<td class="text-wrap"></td>-->
												<td class="text-wrap" th:text="${detail.status.statusName}"></td>
												<td class="text-wrap" th:text="${detail.user.firstName}"></td>
												<td class="text-wrap" th:text="${detail.counselName.name}"></td>
												<td class="text-wrap" th:text="${detail.procourtdtl.cnrNumber}"></td>
										</tr>

									</tbody>

								</table>
							</div>



						</div>
					</div>
				</div>
			</div>
		</form>


		<script src="plugins/bootstrap-datatable/js/jquery.dataTables.min.js"></script>
		<script
			src="plugins/bootstrap-datatable/js/dataTables.bootstrap4.min.js"></script>
		<script src="plugins/bootstrap-datatable/js/dataTables.buttons.min.js"></script>
		<script src="plugins/bootstrap-datatable/js/buttons.bootstrap4.min.js"></script>
		<script src="plugins/bootstrap-datatable/js/jszip.min.js"></script>
		<script src="plugins/bootstrap-datatable/js/pdfmake.min.js"></script>
		<script src="plugins/bootstrap-datatable/js/vfs_fonts.js"></script>
		<script src="plugins/bootstrap-datatable/js/buttons.html5.min.js"></script>
		<script src="plugins/bootstrap-datatable/js/buttons.print.min.js"></script>
		<script src="plugins/bootstrap-datatable/js/buttons.colVis.min.js"></script>
		<script type="text/javascript">
			$(document)
					.ready(
							function() {
								$("#startdate")
										.datepicker({

											format : 'dd-mm-yyyy',
											endDate : new Date(),
										// autoclose: true,
										})
										.on(
												'changeDate',
												function(selected) {
													var minDate = new Date(
															selected.date
																	.valueOf());
													var seven_date = minDate
															.getDate() + 7;
													var curr_month = minDate
															.getMonth();

													var curr_year = minDate
															.getFullYear();
													var sevenDate = (seven_date
															+ "/" + curr_month
															+ "/" + curr_year);
													$('#enddate').datepicker(
															'setStartDate',
															minDate);
												});

								

								$("#enddate").datepicker({
									format : 'dd-mm-yyyy',
								//endDate : new Date(),

								}).on(
										'changeDate',
										function(selected) {
											var minDate = new Date(
													selected.date.valueOf());

											$('#startdate').datepicker(
													'setEndDate', minDate);
										});

								var table = $('#weaklyReport')
										.DataTable(
												{
													//		 	        lengthChange: false,
													dom : 'Bfrtip',
													/* buttons: [
													    'copyHtml5',
													    'excelHtml5',
													    'csvHtml5',
													    'pdfHtml5'
													] */
													buttons : {
														buttons : [
																{
																	extend : 'excel',
																	text : '<i class="fa fa-print"></i> Excel',
																	title : $(
																			'h4')
																			.text(),

																	exportOptions : {
																		columns : ':not(.no-print)'
																	},
																	footer : true,
																	autoPrint : false
																},
																/* {
																      extend: 'print',
																      
																		
																      text: '<i class="fa fa-print"></i> Print',
																   
																      title: $('h4').text(),
																      exportOptions: {
																        columns: ':not(.no-print)'
																      },
																      footer: true,
																      autoPrint: false
																    }, */{
																	//  extend: 'pdf',

																	extend : 'pdfHtml5',
																	orientation : 'landscape',
																	pageSize : 'A3',

																	text : '<i class="fa fa-file-pdf-o"></i> PDF',
																	title : $(
																			'h4')
																			.text(),

																	exportOptions : {
																		columns : ':not(.no-print)'
																	},
																	footer : true
																} ],

														dom : {
															container : {
																className : 'dt-buttons'
															},
															button : {
																className : 'btn btn-default'
															}
														}
													}
												});
							});
		</script>




	</div>
</body>
</html>
